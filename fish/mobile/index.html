<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>湖畔垂钓 · 触屏版</title>
<meta name="theme-color" content="#0b1a2b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
<style>
  /* ==========================================================
        设计系统（Design Tokens）
        ========================================================== */
  :root {
    /* 色板 */
    --bg:        #08111d;
    --surface:   rgba(20, 38, 64, 0.62);
    --surface-2: rgba(255, 255, 255, 0.04);
    --border:    rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text:      #eaf3ff;
    --text-2:    #9fb1c6;
    --text-3:    #6c8197;
    --primary:   #5be3c2;        /* 青绿 - CTA、强调 */
    --primary-2: #7ad7ff;        /* 天蓝 - 副强调 */
    --accent:    #ffd166;        /* 暖黄 - 数值 */
    --danger:    #ff7676;
    --success:   #7be39c;

    /* 间距 */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* 圆角 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;

    /* 阴影 */
    --shadow-1: 0 4px 12px rgba(0,0,0,.35);
    --shadow-2: 0 12px 40px rgba(0,0,0,.5);
    --shadow-3: 0 24px 64px rgba(0,0,0,.55);

    /* 字号 */
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
    --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px; --fs-display: 32px;
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: 60px 1fr 132px;
    background:
      radial-gradient(ellipse at 20% 0%, #1f3f66 0%, var(--bg) 60%),
      linear-gradient(180deg, var(--bg) 0%, #050b14 100%);
  }

  /* ---------- 顶部 HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .hud .left, .hud .right { display: flex; align-items: center; gap: 10px; }
  .title {
    font-weight: 800; letter-spacing: 1.5px; font-size: var(--fs-xl);
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-right: 6px;
  }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 12px; border-radius: var(--r-pill);
    font-size: var(--fs-md); display: flex; align-items: center; gap: 6px;
    color: var(--text);
    transition: background .15s;
  }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip b { color: var(--accent); font-weight: 700; }
  .xp-bar {
    width: 100px; height: 6px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.08); overflow: hidden; position: relative;
  }
  .xp-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    transition: width .4s;
  }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: var(--fs-md);
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #2a6fa5 0%, #143457 60%, #0a1e36 100%);
  }

  /* 浮漂动画 */
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  @keyframes nibble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-14px) rotate(-6deg); } }
  @keyframes bite   { 0%{transform: translateY(-6px);} 40%{transform: translateY(20px);} 100%{transform: translateY(0);} }
  @keyframes shake  { 0%,100%{ transform: translateX(0);} 25%{transform:translateX(-3px);}75%{transform:translateX(3px);} }

  /* 飘字 */
  .float-text {
    position:absolute; font-weight:800; font-size:var(--fs-xl);
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    animation: floatUp 1.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp {
    from { opacity:1; transform:translate(-50%,0); }
    to   { opacity:0; transform:translate(-50%,-60px); }
  }

  /* ---------- 面板（卡片） ---------- */
  .panel {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .panel header {
    padding: 12px 16px; font-weight: 700; letter-spacing: 1px;
    font-size: var(--fs-md);
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel .body { padding: 14px 16px; }

  /* ---------- 地点面板 ---------- */
  .left-panel { left: 16px; top: 16px; width: 280px; }
  .place-list { display: grid; gap: 10px; }
  .place {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    position: relative;
  }
  .place:hover {
    background: rgba(255,255,255,.07);
    transform: translateX(2px);
    border-color: var(--border-strong);
  }
  .place.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(91,227,194,.08), rgba(255,255,255,.02));
    box-shadow: 0 0 0 1px var(--primary) inset;
  }
  .place.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--primary); border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .place h4 {
    font-size: var(--fs-base); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .place p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; }
  .place .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 500;
  }
  .tag.lock { opacity:.45; }
  .tag.req { color: var(--accent); }
  .tag.weather-晴{color:#ffd166;} .tag.weather-雨{color:var(--primary-2);}
  .tag.weather-雾{color:#cfd6e4;} .tag.weather-雪{color:#e0eaff;}

  /* ---------- 右侧浮按钮 ---------- */
  .right-stack {
    position: absolute; right: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .side-btn {
    width: 80px; padding: 10px 0; text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    cursor: pointer; transition: all .15s;
    font-size: var(--fs-sm); color: var(--text);
    backdrop-filter: blur(8px);
  }
  .side-btn:hover {
    background: rgba(255,255,255,.10);
    transform: translateY(-2px);
    border-color: var(--border-strong);
  }
  .side-btn:active { transform: translateY(0); }
  .side-btn .ico {
    font-size: 22px; display: block; margin-bottom: 2px;
    line-height: 1;
  }

  /* ---------- 底部控制区 ---------- */
  .controls {
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.35));
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 20px;
    padding: 14px 22px;
    backdrop-filter: blur(8px);
  }
  .col h5 {
    font-size: var(--fs-xs);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .bait-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .bait {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    font-size: var(--fs-sm);
    background: rgba(255,255,255,.03);
    transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .bait:hover {
    background: rgba(255,255,255,.08);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .bait.active {
    border-color: var(--accent);
    background: rgba(255, 209, 102, .10);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .bait.disabled { opacity: .35; cursor: not-allowed; }
  .bait .emoji { font-size: 22px; line-height: 1; }
  .bait .nm { font-weight: 700; color: var(--text); }
  .bait .cnt {
    font-size: var(--fs-xs); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
  }
  .cast-power { min-width: 0; }
  .cast-power input[type=range] {
    width: 100%; height: 4px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    -webkit-appearance: none; appearance: none;
    outline: none;
  }
  .cast-power input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(91,227,194,.15);
  }
  .cast-power input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer; border: none;
  }
  .cast-power small {
    display: block;
    color: var(--text-2);
    font-size: var(--fs-sm);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cast-power small b { color: var(--accent); font-weight: 700; }

  .big-cast {
    font-size: var(--fs-lg);
    padding: 14px 24px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, #ffb45e, #ff7a59);
    color: #2c1206; border: none; cursor: pointer; font-weight: 800;
    box-shadow: 0 8px 24px rgba(255,140,80,.35);
    transition: transform .1s, box-shadow .15s;
    white-space: nowrap;
  }
  .big-cast:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,140,80,.45); }
  .big-cast:active { transform: translateY(0); }
  .big-cast:disabled { filter: grayscale(.6); opacity:.6; cursor:not-allowed; transform:none; box-shadow: none; }

  /* ---------- 统计区 ---------- */
  .stats-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: var(--fs-md);
    align-content: center;
  }
  .stats-mini > span { color: var(--text-3); font-size: var(--fs-sm); }
  /* ---------- 响应式（移动优先） ---------- */
  /* 平板横屏 */
  @media (max-width: 900px) {
    .left-panel { width: 200px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .side-btn { width: 70px; }
  }
  /* 手机横屏 / 折叠屏 */
  @media (max-width: 720px) {
    body { grid-template-rows: 48px 1fr auto; }
    .hud { padding: 0 10px; }
    .hud .left, .hud .right { gap: 6px; }
    .title { font-size: 14px; letter-spacing: 1px; }
    .chip { font-size: 11px; padding: 4px 7px; }
    .chip:nth-child(2) { display: none; }       /* 隐藏经验条（HUD 紧凑） */
    .left-panel { display: none; width: 80vw; max-width: 320px; top: 48px; bottom: auto; left: 0;
                  transform: translateX(-100%); transition: transform .22s ease; }
    .left-panel.open { display: block; transform: translateX(0); }
    .right-stack { right: 6px; top: 60px; gap: 6px; }
    .side-btn { width: 56px; padding: 6px 0; font-size: 11px; }
    .side-btn .ico { font-size: 16px; }
    .controls { grid-template-columns: 1fr; padding: 8px 10px; gap: 8px; }
    .controls > .col:last-child { display: none; }   /* 小屏隐藏"本局"统计，省字号 */
    .big-cast { font-size: 16px; padding: 14px 20px; }
    .bait-grid { grid-template-columns: repeat(5, 1fr); }
    .bait .emoji { font-size: 20px; }
  }
  /* 手机竖屏 */
  @media (max-width: 480px) {
    .hud .right .chip:not(.toggle-stat) { display: none; }
    .hud .right .toggle-stat { display: inline-flex !important; }   /* 由 JS 在 <420 才显示 */
    .controls { grid-template-columns: 1fr; }
    .bait-grid { grid-template-columns: repeat(3, 1fr); }
    .big-cast { width: 100%; padding: 16px 0; font-size: 18px; }
    .modal { width: 96vw; max-height: 92vh; }
  }
  /* 极小屏（折叠副屏） */
  @media (max-width: 360px) {
    .bait-grid { grid-template-columns: repeat(2, 1fr); }
    .bait .nm { font-size: 11px; }
  }
</style>
</head>
<body>

  <!-- 顶部 -->
  <div class="hud">
    <div class="left">
      <div class="title">🎣 湖畔垂钓</div>
      <div class="chip">💰 <b id="hud-money">0</b> 金币</div>
      <div class="chip">Lv.<b id="hud-level">1</b>
        <div class="xp-bar"><i id="hud-xp"></i></div>
      </div>
      <div class="chip" id="hud-weather">☀ 晴</div>
    </div>
    <div class="right">
      <div class="chip">📍 <b id="hud-place">青石湖</b></div>
      <div class="chip">⏱ <b id="hud-time">清晨</b></div>
      <button class="btn" id="btn-save">💾 存档</button>
      <button class="btn" id="btn-reset">♻ 重开</button>
    </div>
  </div>

  <!-- 主舞台：3D 场景 -->
  <div class="stage" id="stage">
    <canvas id="three-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;"></canvas>
    <!-- 飘字/浮提示保留为 DOM 叠层 -->
    <div class="hint" id="hint">选择地点与鱼饵，按下「抛竿」开始 🎣</div>
  </div>

  <!-- 底部 -->
  <div class="controls">
    <div class="col">
      <h5>鱼饵</h5>
      <div class="bait-grid" id="bait-grid"></div>
    </div>
    <div class="col">
      <h5>行动</h5>
      <div class="action-grid">
        <div class="cast-power">
          <input type="range" id="power" min="0" max="100" value="60"/>
          <small>力度：<b id="power-val">60</b>（影响上鱼距离与稀有度加成）</small>
        </div>
        <button class="big-cast" id="cast">🎣 抛竿</button>
        <button class="btn" id="reel" disabled>↩ 收线</button>
      </div>
    </div>
    <div class="col">
      <h5>本局</h5>
      <div class="stats-mini">
        <span>捕获</span><b id="stat-catch">0</b>
        <span>最重</span><b id="stat-heaviest">—</b>
        <span>总收入</span><b id="stat-earn">0</b>
        <span>出竿</span><b id="stat-cast">0</b>
        <span>逃跑</span><b id="stat-escape">0</b>
        <span>命中率</span><b id="stat-hit">—</b>
      </div>
    </div>
  </div>

  <!-- 右侧浮按钮 -->
  <div class="right-stack">
    <div class="side-btn" data-modo="places"><span class="ico">📍</span>地点</div>
    <div class="side-btn" data-modo="logs"><span class="ico">📜</span>日志</div>
    <div class="side-btn" data-modo="codex"><span class="ico">📖</span>图鉴</div>
    <div class="side-btn" data-modo="shop"><span class="ico">🛒</span>商店</div>
    <div class="side-btn" data-modo="achv"><span class="ico">🏅</span>成就</div>
    <div class="side-btn" data-modo="help"><span class="ico">❓</span>玩法</div>
  </div>

  <!-- 左侧：地点 -->
  <div class="panel left-panel">
    <header>钓鱼地点</header>
    <div class="body">
      <div class="place-list" id="place-list"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <header>
        <div id="modal-title">题库</div>
        <div class="close" id="modal-close">✕</div>
      </header>
      <div class="body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>


<script type="module" src="./src/main.js"></script>
</body>
</html>
