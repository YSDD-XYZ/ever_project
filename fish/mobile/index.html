<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a2b" media="(prefers-color-scheme: dark)" />
<title>湖畔垂钓 · 触屏版</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<!-- importmap：把 three 映射到本地 vendor。避免 CDN 不可用 / CORS 问题 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<style>
  /* ==========================================================
        设计系统（Design Tokens）
        ========================================================== */
  :root {
    /* 色板 */
    --bg:        #08111d;
    --surface:   rgba(20, 38, 64, 0.62);
    --surface-2: rgba(255, 255, 255, 0.04);
    --border:    rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text:      #eaf3ff;
    --text-2:    #9fb1c6;
    --text-3:    #6c8197;
    --primary:   #5be3c2;        /* 青绿 - CTA、强调 */
    --primary-2: #7ad7ff;        /* 天蓝 - 副强调 */
    --accent:    #ffd166;        /* 暖黄 - 数值 */
    --danger:    #ff7676;
    --success:   #7be39c;

    /* 间距 */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* 圆角 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;

    /* 阴影 */
    --shadow-1: 0 4px 12px rgba(0,0,0,.35);
    --shadow-2: 0 12px 40px rgba(0,0,0,.5);
    --shadow-3: 0 24px 64px rgba(0,0,0,.55);

    /* 字号 */
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
    --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px; --fs-display: 32px;
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: 60px 1fr 132px;
    background:
      radial-gradient(ellipse at 20% 0%, #1f3f66 0%, var(--bg) 60%),
      linear-gradient(180deg, var(--bg) 0%, #050b14 100%);
  }

  /* ---------- 顶部 HUD ---------- */
  .hud {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 14px 6px;
    background: linear-gradient(180deg, rgba(0,0,0,.32), rgba(0,0,0,0));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    position: relative; z-index: 5;
  }
  .hud-row { display: flex; align-items: center; gap: 8px; }
  .hud-primary { justify-content: space-between; }
  .hud-secondary { justify-content: space-between; padding-left: 2px; }
  .hud-secondary .chip { padding: 4px 8px; font-size: 11px; }
  .title {
    font-weight: 800; letter-spacing: 1px; font-size: 14px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  .chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 4px 10px; border-radius: var(--r-pill);
    font-size: var(--fs-md); display: inline-flex; align-items: center; gap: 5px;
    color: var(--text);
    transition: background .15s;
    backdrop-filter: blur(4px);
  }
  .chip:active { background: rgba(255,255,255,.12); }
  .chip b { color: var(--accent); font-weight: 700; }
  .chip-money b { font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; }
  .chip-menu { padding: 4px 10px; font-size: 16px; font-weight: 700; cursor: pointer; min-width: 36px; justify-content: center; }
  .xp-bar {
    width: 80px; height: 5px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.08); overflow: hidden; position: relative;
  }
  .xp-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    transition: width .4s;
  }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: var(--fs-md);
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #2a6fa5 0%, #143457 60%, #0a1e36 100%);
  }

  /* 浮漂动画 */
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  @keyframes nibble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-14px) rotate(-6deg); } }
  @keyframes bite   { 0%{transform: translateY(-6px);} 40%{transform: translateY(20px);} 100%{transform: translateY(0);} }
  @keyframes shake  { 0%,100%{ transform: translateX(0);} 25%{transform:translateX(-3px);}75%{transform:translateX(3px);} }

  /* 飘字 */
  .float-text {
    position:absolute; font-weight:800; font-size:var(--fs-xl);
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    animation: floatUp 1.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp {
    from { opacity:1; transform:translate(-50%,0); }
    to   { opacity:0; transform:translate(-50%,-60px); }
  }

  /* ---------- 面板（卡片） ---------- */
  .panel {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .panel header {
    padding: 12px 16px; font-weight: 700; letter-spacing: 1px;
    font-size: var(--fs-md);
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel .body { padding: 14px 16px; }

  /* ---------- 地点面板（mobile 专用：抽屉 + 半透明背景） ---------- */
  .place-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: 49; opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .place-backdrop.show { opacity: 1; pointer-events: auto; }
  .left-panel {
    left: 0; top: 0; bottom: 0;
    width: 84vw; max-width: 360px;
    border-radius: 0;
    border-right: 1px solid var(--border-strong);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform .25s cubic-bezier(.2, .8, .3, 1);
    overflow-y: auto;
    box-shadow: 4px 0 24px rgba(0,0,0,.4);
  }
  .left-panel.open { transform: translateX(0); }
  .place-list { display: grid; gap: 10px; }
  .place {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    position: relative;
  }
  .place:hover {
    background: rgba(255,255,255,.07);
    border-color: var(--border-strong);
  }
  .place.active {
    border-color: var(--primary);
    background: rgba(91,227,194,.10);
  }
  .place.locked {
    opacity: .55; cursor: not-allowed;
    border-style: dashed;
  }
  .place.locked::before {
    content: '🔒';
    position: absolute; top: 8px; right: 8px;
    font-size: 14px;
  }
  .place-req {
    font-size: 10px; color: var(--text-3);
    margin-top: 4px;
  }
  .place.locked:hover { transform: none; }
  .place.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(91,227,194,.08), rgba(255,255,255,.02));
    box-shadow: 0 0 0 1px var(--primary) inset;
  }
  .place.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--primary); border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .place h4 {
    font-size: var(--fs-base); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .place p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; }
  .place .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 500;
  }
  .tag.lock { opacity:.45; }
  .tag.req { color: var(--accent); }
  .tag.weather-晴{color:#ffd166;} .tag.weather-雨{color:var(--primary-2);}
  .tag.weather-雾{color:#cfd6e4;} .tag.weather-雪{color:#e0eaff;}

  /* ---------- FAB 圆形按钮 + 弹出菜单 ---------- */
  .fab {
    position: fixed; right: 16px; bottom: 200px;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; cursor: pointer;
    font-size: 24px; font-weight: 800;
    box-shadow: 0 8px 24px rgba(91,227,194,.4);
    z-index: 7;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }
  .fab-menu {
    position: fixed; right: 16px; bottom: 264px;
    display: flex; flex-direction: column-reverse; gap: 6px;
    z-index: 6;
    opacity: 0; transform: translateY(20px) scale(.9);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .fab-menu.open {
    opacity: 1; transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .fab-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: rgba(15, 28, 50, .92);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-pill);
    color: var(--text);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    transition: background .15s, transform .15s;
    min-width: 96px;
  }
  .fab-item:active { background: rgba(91,227,194,.18); transform: scale(.97); }
  .fab-item .ico { font-size: 16px; }
  .fab-item.fab-danger { color: var(--danger); }
  .fab-divider {
    height: 1px; background: var(--border);
    margin: 4px 8px;
  }
  .fab-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 5; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .fab-backdrop.show { opacity: 1; pointer-events: auto; }

  /* ---------- 折叠式统计抽屉 ---------- */
  .stats-drawer {
    position: fixed; left: 12px; bottom: 280px;
    background: rgba(15, 28, 50, .88);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    backdrop-filter: blur(10px);
    z-index: 4;
    max-width: calc(100vw - 80px);
  }
  .stats-drawer summary {
    list-style: none;
    padding: 6px 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-2);
    user-select: none;
  }
  .stats-drawer summary::-webkit-details-marker { display: none; }
  .stats-drawer summary .ico { font-size: 14px; }
  .stats-drawer summary .chev { margin-left: auto; transition: transform .2s; }
  .stats-drawer[open] summary .chev { transform: rotate(180deg); }
  .stats-drawer .stats-mini {
    padding: 8px 12px 10px;
    border-top: 1px solid var(--border);
    grid-template-columns: repeat(3, auto);
    gap: 4px 14px;
    font-size: 11px;
    display: grid;
  }

  /* ---------- 底部控制区：精简（鱼饵横滑 + 力度 + 抛杆） ---------- */
  .controls {
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.5));
    border-top: 1px solid var(--border);
    padding: 8px 14px 12px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; flex-direction: column; gap: 8px;
  }

  /* 鱼饵：横向滚动 */
  .bait-row {
    display: flex; gap: 6px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 2px 2px 4px;
  }
  .bait-row::-webkit-scrollbar { display: none; }
  .bait {
    flex: 0 0 auto;
    min-width: 56px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 6px 8px;
    cursor: pointer;
    text-align: center;
    font-size: 11px;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    scroll-snap-align: start;
  }
  .bait:hover {
    background: rgba(255,255,255,.08);
    border-color: var(--border-strong);
  }
  .bait.active {
    border-color: var(--accent);
    background: rgba(255, 209, 102, .12);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .bait.disabled { opacity: .35; cursor: not-allowed; }
  .bait .emoji { font-size: 18px; line-height: 1; }
  .bait .nm { font-weight: 700; color: var(--text); font-size: 10px; }
  .bait .cnt {
    font-size: 9px; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  /* 力度：-  +  数值 */
  .power-row {
    display: flex; align-items: center; gap: 8px;
  }
  .power-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    color: var(--primary);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .power-btn:active { background: rgba(91,227,194,.18); transform: scale(.92); }
  .power-bar {
    flex: 1; position: relative;
    height: 8px;
    background: rgba(255,255,255,.08);
    border-radius: var(--r-pill);
    overflow: hidden;
  }
  .power-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 60%;
    background: linear-gradient(90deg, var(--primary-2), var(--accent));
    border-radius: var(--r-pill);
    transition: width .15s;
  }
  .power-bar input[type=range] {
    position: absolute; inset: -6px 0;
    width: 100%; height: 20px;
    margin: 0; padding: 0;
    background: transparent;
    -webkit-appearance: none; appearance: none;
    outline: none;
    opacity: 0;
    cursor: pointer;
  }
  .power-val {
    font-size: 12px; font-weight: 700; color: var(--accent);
    min-width: 28px; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* 抛杆 + 收线 行 */
  .cast-row {
    display: flex; gap: 8px; align-items: center;
  }
  .big-cast {
    flex: 1;
    font-size: 16px;
    padding: 12px 20px;
    border-radius: var(--r-pill);
    background: linear-gradient(135deg, #ffb45e, #ff7a59);
    color: #2c1206; border: none; cursor: pointer; font-weight: 800;
    box-shadow: 0 6px 18px rgba(255,140,80,.4);
    transition: transform .1s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: 1px;
    position: relative;
  }
  .big-cast:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,140,80,.5); }
  .big-cast:active { transform: translateY(0) scale(.97); }
  .big-cast:disabled { filter: grayscale(.6); opacity:.55; cursor:not-allowed; transform:none; box-shadow: none; }
  .btn-reel {
    padding: 12px 18px;
    border-radius: var(--r-pill);
    background: rgba(91,227,194,.15);
    border: 1px solid var(--primary);
    color: var(--primary);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  .btn-reel:active { background: rgba(91,227,194,.28); }
  .btn-reel:disabled { opacity:.35; cursor:not-allowed; }

  /* 抛杆 cooldown 圆环 */
  .cast-ring {
    position: fixed; right: 12px; bottom: 144px;
    width: 60px; height: 60px;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .cast-ring.show { opacity: 1; }
  #cast-ring-fill { transition: stroke-dashoffset .15s linear; }

  /* ---------- 统计区 ---------- */
  .stats-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: var(--fs-md);
    align-content: center;
  }
  .stats-mini > span { color: var(--text-3); font-size: var(--fs-sm); }
  /* ---------- 响应式：mobile 优先，桌面微调 ---------- */
  /* 平板横屏：抽屉稍窄，控制区 padding 稍大 */
  @media (min-width: 720px) {
    .hud { padding: 10px 22px 8px; }
    .hud-row { gap: 10px; }
    .chip { padding: 6px 12px; font-size: var(--fs-md); }
    .hud-secondary .chip { font-size: var(--fs-md); padding: 6px 12px; }
    .controls { padding: 10px 22px 14px; }
    .bait { min-width: 64px; padding: 8px 10px; }
    .bait .emoji { font-size: 22px; }
    .bait .nm { font-size: 11px; }
    .bait .cnt { font-size: 10px; }
    .left-panel { width: 360px; }
  }
  /* 桌面：FAB 切回侧边按钮，HUD 顶栏平铺 */
  @media (min-width: 1024px) {
    .fab, .fab-menu, .fab-backdrop, .cast-ring { display: none !important; }
    .controls { flex-direction: row; align-items: center; }
    .bait-row { flex: 1; }
    .power-row { flex: 0 0 220px; }
    .cast-row { flex: 0 0 auto; }
    .big-cast { flex: 0 0 auto; min-width: 140px; }
  }
  /* 极小屏（折叠副屏） */
  @media (max-width: 360px) {
    .bait { min-width: 50px; }
    .stats-drawer { bottom: 264px; }
  }

  /* ---------- 新手引导 ---------- */
  .onboard-mask {
    position: fixed; inset: 0;
    z-index: 90;
    background: rgba(5, 10, 18, .55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 100px;
  }
  .onboard-mask.show { display: flex; }
  .onboard-card {
    width: min(440px, 92vw);
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.4);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    padding: 22px 22px 16px;
    position: relative;
    animation: onboardPop .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes onboardPop {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .onboard-step {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .onboard-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .onboard-desc {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .onboard-progress {
    display: flex; gap: 4px;
    margin-bottom: 14px;
  }
  .onboard-dot {
    flex: 1; height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    transition: background .25s;
  }
  .onboard-dot.active { background: var(--primary); }
  .onboard-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .onboard-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    transition: all .15s;
  }
  .onboard-btn:hover { background: rgba(255,255,255,.12); }
  .onboard-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .onboard-skip {
    font-size: 12px;
    color: var(--text-3);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .onboard-skip:hover { color: var(--text-2); }

  /* 高亮：被指引的元素 */
  .onboard-highlight {
    position: relative;
    z-index: 91;
    box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary) !important;
    border-radius: var(--r-md);
    animation: onboardPulse 1.5s ease-in-out infinite;
  }
  @keyframes onboardPulse {
    0%,100% { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary); }
    50%     { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 10px var(--primary); }
  }

  /* ---------- 中央提示条 ---------- */
  /* ---------- Loading 屏 ---------- */
  .loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity .4s ease-out;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading-inner { text-align: center; }
  .loading-fish {
    font-size: 56px;
    animation: bobUp 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(91,227,194,.4));
  }
  @keyframes bobUp {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  .loading-text {
    margin-top: 14px;
    color: var(--text-2);
    font-size: var(--fs-md);
    letter-spacing: 2px;
  }
  .loading-bar {
    margin: 12px auto 0;
    width: 200px; height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    overflow: hidden;
    position: relative;
  }
  .loading-bar::before {
    content: ""; position: absolute; left: -40%; top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: loadingSweep 1.4s ease-in-out infinite;
  }
  @keyframes loadingSweep {
    from { left: -40%; } to { left: 100%; }
  }
/* ---------- <noscript> Fallback ---------- */
  .noscript-fallback {
    max-width: 480px; margin: 18vh auto;
    padding: 32px 28px;
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.3);
    border-radius: 16px;
    text-align: center;
    color: var(--text);
  }
  .noscript-fallback h1 {
    font-size: 24px; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .noscript-fallback p {
    color: var(--text-2);
    font-size: 14px; line-height: 1.7;
    margin-bottom: 8px;
  }</style>
</head>
<body>

  <!-- 顶部 HUD：紧凑两行 -->
  <div class="hud">
    <div class="hud-row hud-primary">
      <div class="title">🎣 湖畔垂钓</div>
      <div class="chip chip-money">💰 <b id="hud-money">0</b></div>
      <div class="chip chip-level">Lv.<b id="hud-level">1</b>
        <div class="xp-bar"><i id="hud-xp"></i></div>
      </div>
    </div>
    <div class="hud-row hud-secondary">
      <div class="chip chip-place">📍 <b id="hud-place">青石湖</b></div>
      <div class="chip chip-weather" id="hud-weather">☀ 晴</div>
      <div class="chip chip-time">⏱ <b id="hud-time">清晨</b></div>
      <button class="chip chip-menu" id="btn-menu" aria-label="更多">⋯</button>
    </div>
  </div>

  <!-- 主舞台：3D 场景 -->
  <div class="stage" id="stage">
    <canvas id="three-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;"></canvas>
    <!-- 飘字/浮提示保留为 DOM 叠层 -->
    <div class="hint" id="hint">选择地点与鱼饵，按下「抛竿」开始 🎣</div>
  </div>

  <!-- 底部：精简控制条（鱼饵 + 力度 + FAB） -->
  <div class="controls">
    <!-- 鱼饵横滑 -->
    <div class="bait-row" id="bait-row"></div>

    <!-- 力度调整 -->
    <div class="power-row">
      <button class="power-btn" id="power-down" aria-label="减小力度">－</button>
      <div class="power-bar">
        <div class="power-fill" id="power-fill"></div>
        <input type="range" id="power" min="0" max="100" value="60"/>
      </div>
      <button class="power-btn" id="power-up" aria-label="加大力度">＋</button>
      <span class="power-val" id="power-val">60</span>
    </div>

    <!-- 抛杆 + 收线 -->
    <div class="cast-row">
      <button class="big-cast" id="cast">🎣 抛竿</button>
      <button class="btn-reel" id="reel" disabled>↩ 收线</button>
    </div>
  </div>

  <!-- FAB：抛杆 cooldown 进度环 -->
  <svg class="cast-ring" id="cast-ring" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
    <circle id="cast-ring-fill" cx="50" cy="50" r="46" fill="none" stroke="var(--primary)" stroke-width="4"
            stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 50 50)" stroke-linecap="round"/>
  </svg>

  <!-- 浮动：收起式菜单（替代原右侧 6 按钮） -->
  <button class="fab" id="btn-fab" aria-label="打开菜单">⋯</button>
  <div class="fab-menu" id="fab-menu">
    <button class="fab-item" data-modo="places"><span class="ico">📍</span><span>地点</span></button>
    <button class="fab-item" data-modo="logs"><span class="ico">📜</span><span>日志</span></button>
    <button class="fab-item" data-modo="codex"><span class="ico">📖</span><span>图鉴</span></button>
    <button class="fab-item" data-modo="shop"><span class="ico">🛒</span><span>商店</span></button>
    <button class="fab-item" data-modo="achv"><span class="ico">🏅</span><span>成就</span></button>
    <button class="fab-item" data-modo="help"><span class="ico">❓</span><span>玩法</span></button>
    <div class="fab-divider"></div>
    <button class="fab-item" id="fab-save"><span class="ico">📤</span><span>导出</span></button>
    <button class="fab-item" id="fab-load"><span class="ico">📥</span><span>导入</span></button>
    <button class="fab-item" id="fab-slots"><span class="ico">📚</span><span>存档</span></button>
    <button class="fab-item fab-danger" id="fab-reset"><span class="ico">♻</span><span>重开</span></button>
  </div>

  <!-- 折叠式统计抽屉 -->
  <details class="stats-drawer" id="stats-drawer">
    <summary>
      <span class="ico">📊</span>
      <span>本局统计</span>
      <span class="chev">▾</span>
    </summary>
    <div class="stats-mini">
      <span>捕获</span><b id="stat-catch">0</b>
      <span>最重</span><b id="stat-heaviest">—</b>
      <span>总收入</span><b id="stat-earn">0</b>
      <span>出竿</span><b id="stat-cast">0</b>
      <span>逃跑</span><b id="stat-escape">0</b>
      <span>命中率</span><b id="stat-hit">—</b>
    </div>
  </details>

  <!-- 左侧抽屉背景 -->
  <div class="place-backdrop" id="place-backdrop"></div>

  <!-- 左侧：地点 -->
  <div class="panel left-panel">
    <header>钓鱼地点</header>
    <div class="body">
      <div class="place-list" id="place-list"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <header>
        <div id="modal-title">题库</div>
        <div class="close" id="modal-close">✕</div>
      </header>
      <div class="body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Loading 屏 -->
  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-fish">🐟</div>
      <div class="loading-text">湖畔垂钓 · 加载中</div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- 新手引导 -->
  <div class="onboard-mask" id="onboard">
    <div class="onboard-card">
      <div class="onboard-step" id="onboard-step">STEP 1 / 6</div>
      <div class="onboard-title" id="onboard-title">选一个钓鱼地点</div>
      <div class="onboard-desc" id="onboard-desc">左侧面板列出可用的钓鱼点。</div>
      <div class="onboard-progress" id="onboard-progress"></div>
      <div class="onboard-actions">
        <span class="onboard-skip" id="onboard-skip">跳过引导</span>
        <button class="onboard-btn primary" id="onboard-next">下一步 →</button>
      </div>
    </div>
  </div>


<script type="module" src="./src/main.js"></script>
<script>window.__storagePrefix = 'fishing_mobile';</script>

  <noscript>
    <div class="noscript-fallback">
      <h1>🎣 湖畔垂钓</h1>
      <p>本游戏需要 JavaScript 与 WebGL 才能运行。</p>
      <p>请在浏览器中启用 JavaScript，或使用支持 WebGL 的现代浏览器（Chrome / Edge / Firefox / Safari）。</p>
    </div>
  </noscript>
</body>
</html>
