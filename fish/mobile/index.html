<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a2b" media="(prefers-color-scheme: dark)" />
<title>湖畔垂钓 · 触屏版</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<!-- importmap：把 three 映射到本地 vendor。避免 CDN 不可用 / CORS 问题 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<style>
  /* ==========================================================
        设计系统（Design Tokens）
        ========================================================== */
  :root {
    /* 色板 */
    --bg:        #08111d;
    --surface:   rgba(20, 38, 64, 0.62);
    --surface-2: rgba(255, 255, 255, 0.04);
    --border:    rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text:      #eaf3ff;
    --text-2:    #9fb1c6;
    --text-3:    #6c8197;
    --primary:   #5be3c2;        /* 青绿 - CTA、强调 */
    --primary-2: #7ad7ff;        /* 天蓝 - 副强调 */
    --accent:    #ffd166;        /* 暖黄 - 数值 */
    --danger:    #ff7676;
    --success:   #7be39c;

    /* 间距 */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* 圆角 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;

    /* 阴影 */
    --shadow-1: 0 4px 12px rgba(0,0,0,.35);
    --shadow-2: 0 12px 40px rgba(0,0,0,.5);
    --shadow-3: 0 24px 64px rgba(0,0,0,.55);

    /* 字号 */
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
    --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px; --fs-display: 32px;
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: 60px 1fr 132px;
    background:
      radial-gradient(ellipse at 20% 0%, #1f3f66 0%, var(--bg) 60%),
      linear-gradient(180deg, var(--bg) 0%, #050b14 100%);
  }

  /* ---------- 顶部 HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .hud .left, .hud .right { display: flex; align-items: center; gap: 10px; }
  .title {
    font-weight: 800; letter-spacing: 1.5px; font-size: var(--fs-xl);
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-right: 6px;
  }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 12px; border-radius: var(--r-pill);
    font-size: var(--fs-md); display: flex; align-items: center; gap: 6px;
    color: var(--text);
    transition: background .15s;
  }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip b { color: var(--accent); font-weight: 700; }
  .xp-bar {
    width: 100px; height: 6px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.08); overflow: hidden; position: relative;
  }
  .xp-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    transition: width .4s;
  }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: var(--fs-md);
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #2a6fa5 0%, #143457 60%, #0a1e36 100%);
  }

  /* 浮漂动画 */
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  @keyframes nibble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-14px) rotate(-6deg); } }
  @keyframes bite   { 0%{transform: translateY(-6px);} 40%{transform: translateY(20px);} 100%{transform: translateY(0);} }
  @keyframes shake  { 0%,100%{ transform: translateX(0);} 25%{transform:translateX(-3px);}75%{transform:translateX(3px);} }

  /* 飘字 */
  .float-text {
    position:absolute; font-weight:800; font-size:var(--fs-xl);
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    animation: floatUp 1.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp {
    from { opacity:1; transform:translate(-50%,0); }
    to   { opacity:0; transform:translate(-50%,-60px); }
  }

  /* ---------- 面板（卡片） ---------- */
  .panel {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .panel header {
    padding: 12px 16px; font-weight: 700; letter-spacing: 1px;
    font-size: var(--fs-md);
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel .body { padding: 14px 16px; }

  /* ---------- 地点面板 ---------- */
  .left-panel { left: 16px; top: 16px; width: 280px; }
  .place-list { display: grid; gap: 10px; }
  .place {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    position: relative;
  }
  .place:hover {
    background: rgba(255,255,255,.07);
    transform: translateX(2px);
    border-color: var(--border-strong);
  }
  .place.locked { opacity: .55; cursor: not-allowed; }
  .place.locked:hover { transform: none; }
  .place.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(91,227,194,.08), rgba(255,255,255,.02));
    box-shadow: 0 0 0 1px var(--primary) inset;
  }
  .place.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--primary); border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .place h4 {
    font-size: var(--fs-base); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .place p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; }
  .place .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 500;
  }
  .tag.lock { opacity:.45; }
  .tag.req { color: var(--accent); }
  .tag.weather-晴{color:#ffd166;} .tag.weather-雨{color:var(--primary-2);}
  .tag.weather-雾{color:#cfd6e4;} .tag.weather-雪{color:#e0eaff;}

  /* ---------- 右侧浮按钮 ---------- */
  .right-stack {
    position: absolute; right: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .side-btn {
    width: 80px; padding: 10px 0; text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    cursor: pointer; transition: all .15s;
    font-size: var(--fs-sm); color: var(--text);
    backdrop-filter: blur(8px);
  }
  .side-btn:hover {
    background: rgba(255,255,255,.10);
    transform: translateY(-2px);
    border-color: var(--border-strong);
  }
  .side-btn:active { transform: translateY(0); }
  .side-btn .ico {
    font-size: 22px; display: block; margin-bottom: 2px;
    line-height: 1;
  }

  /* ---------- 底部控制区 ---------- */
  .controls {
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.35));
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 20px;
    padding: 14px 22px;
    backdrop-filter: blur(8px);
  }
  .col h5 {
    font-size: var(--fs-xs);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .bait-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .bait {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    font-size: var(--fs-sm);
    background: rgba(255,255,255,.03);
    transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .bait:hover {
    background: rgba(255,255,255,.08);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .bait.active {
    border-color: var(--accent);
    background: rgba(255, 209, 102, .10);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .bait.disabled { opacity: .35; cursor: not-allowed; }
  .bait .emoji { font-size: 22px; line-height: 1; }
  .bait .nm { font-weight: 700; color: var(--text); }
  .bait .cnt {
    font-size: var(--fs-xs); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
  }
  .cast-power { min-width: 0; }
  .cast-power input[type=range] {
    width: 100%; height: 4px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    -webkit-appearance: none; appearance: none;
    outline: none;
  }
  .cast-power input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(91,227,194,.15);
  }
  .cast-power input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer; border: none;
  }
  .cast-power small {
    display: block;
    color: var(--text-2);
    font-size: var(--fs-sm);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cast-power small b { color: var(--accent); font-weight: 700; }

  .big-cast {
    font-size: var(--fs-lg);
    padding: 14px 24px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, #ffb45e, #ff7a59);
    color: #2c1206; border: none; cursor: pointer; font-weight: 800;
    box-shadow: 0 8px 24px rgba(255,140,80,.35);
    transition: transform .1s, box-shadow .15s;
    white-space: nowrap;
  }
  .big-cast:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,140,80,.45); }
  .big-cast:active { transform: translateY(0); }
  .big-cast:disabled { filter: grayscale(.6); opacity:.6; cursor:not-allowed; transform:none; box-shadow: none; }

  /* ---------- 统计区 ---------- */
  .stats-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: var(--fs-md);
    align-content: center;
  }
  .stats-mini > span { color: var(--text-3); font-size: var(--fs-sm); }
  /* ---------- 响应式（移动优先） ---------- */
  /* 平板横屏 */
  @media (max-width: 900px) {
    .left-panel { width: 200px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .side-btn { width: 70px; }
  }
  /* 手机横屏 / 折叠屏 */
  @media (max-width: 720px) {
    body { grid-template-rows: 48px 1fr auto; }
    .hud { padding: 0 10px; }
    .hud .left, .hud .right { gap: 6px; }
    .title { font-size: 14px; letter-spacing: 1px; }
    .chip { font-size: 11px; padding: 4px 7px; }
    .chip:nth-child(2) { display: none; }       /* 隐藏经验条（HUD 紧凑） */
    .left-panel { display: none; width: 80vw; max-width: 320px; top: 48px; bottom: auto; left: 0;
                  transform: translateX(-100%); transition: transform .22s ease; }
    .left-panel.open { display: block; transform: translateX(0); }
    .right-stack { right: 6px; top: 60px; gap: 6px; }
    .side-btn { width: 56px; padding: 6px 0; font-size: 11px; }
    .side-btn .ico { font-size: 16px; }
    .controls { grid-template-columns: 1fr; padding: 8px 10px; gap: 8px; }
    .controls > .col:last-child { display: none; }   /* 小屏隐藏"本局"统计，省字号 */
    .big-cast { font-size: 16px; padding: 14px 20px; }
    .bait-grid { grid-template-columns: repeat(5, 1fr); }
    .bait .emoji { font-size: 20px; }
  }
  /* 手机竖屏 */
  @media (max-width: 480px) {
    .hud .right .chip:not(.toggle-stat) { display: none; }
    .hud .right .toggle-stat { display: inline-flex !important; }   /* 由 JS 在 <420 才显示 */
    .controls {
      grid-template-columns: 1fr;
      padding: 10px 14px 88px;          /* 底部留 88px 给 FAB */
      gap: 6px;
    }
    .col h5 { margin-bottom: 6px; font-size: 10px; }
    .bait-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .bait { padding: 6px 2px; }
    .bait .emoji { font-size: 18px; }
    .bait .nm { font-size: 10px; }
    .bait .cnt { font-size: 9px; }
    .action-grid {
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    .cast-power small { display: none; }
    /* mobile FAB 模式：抛杆按钮从 .controls 容器里抽出来浮在右下 */
    .controls .big-cast { display: none; }
    body > .big-cast {
      /* FAB 化：固定在右下角 */
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 30;
      width: 64px; height: 64px;
      padding: 0;
      border-radius: 50%;
      font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(255,140,80,.5), 0 0 0 4px rgba(255,140,80,.15);
      animation: fabPulse 2.4s ease-in-out infinite;
    }
    @keyframes fabPulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(255,140,80,.5), 0 0 0 4px rgba(255,140,80,.15); }
      50%      { box-shadow: 0 8px 24px rgba(255,140,80,.5), 0 0 0 10px rgba(255,140,80,.05); }
    }
    .big-cast:hover { transform: translateY(-3px) scale(1.05); }
    /* 禁用态：冷却中（鱼试探 / 等待收线） */
    .big-cast:disabled {
      animation: fabCooldown 1.4s linear infinite;
      filter: none;
      opacity: 1;
      background: linear-gradient(135deg, #4a4338, #5a4a3a);
      color: rgba(255, 210, 138, .55);
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    @keyframes fabCooldown {
      0%   { box-shadow: 0 0 0 0   rgba(255, 210, 138, .35) inset; }
      100% { box-shadow: 0 0 0 50px rgba(255, 210, 138,  0)  inset; }
    }
    .big-cast:disabled::after {
      content: "⏳";
      position: absolute;
      font-size: 12px;
      bottom: -16px; left: 50%;
      transform: translateX(-50%);
      opacity: .7;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      to { transform: translateX(-50%) rotate(360deg); }
    }
    /* 收线按钮：与 FAB 配套浮起 */
    #reel {
      position: fixed;
      bottom: 22px;
      right: 90px;
      z-index: 30;
      padding: 12px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0,0,0,.4);
    }
    .modal { width: 96vw; max-height: 92vh; }
  }
  /* 极小屏（折叠副屏） */
  @media (max-width: 360px) {
    .bait-grid { grid-template-columns: repeat(3, 1fr); }
    .bait .nm { font-size: 11px; }
  }

  /* ---------- 新手引导 ---------- */
  .onboard-mask {
    position: fixed; inset: 0;
    z-index: 90;
    background: rgba(5, 10, 18, .55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 100px;
  }
  .onboard-mask.show { display: flex; }
  .onboard-card {
    width: min(440px, 92vw);
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.4);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    padding: 22px 22px 16px;
    position: relative;
    animation: onboardPop .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes onboardPop {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .onboard-step {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .onboard-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .onboard-desc {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .onboard-progress {
    display: flex; gap: 4px;
    margin-bottom: 14px;
  }
  .onboard-dot {
    flex: 1; height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    transition: background .25s;
  }
  .onboard-dot.active { background: var(--primary); }
  .onboard-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .onboard-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    transition: all .15s;
  }
  .onboard-btn:hover { background: rgba(255,255,255,.12); }
  .onboard-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .onboard-skip {
    font-size: 12px;
    color: var(--text-3);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .onboard-skip:hover { color: var(--text-2); }

  /* 高亮：被指引的元素 */
  .onboard-highlight {
    position: relative;
    z-index: 91;
    box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary) !important;
    border-radius: var(--r-md);
    animation: onboardPulse 1.5s ease-in-out infinite;
  }
  @keyframes onboardPulse {
    0%,100% { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary); }
    50%     { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 10px var(--primary); }
  }

  /* ---------- 中央提示条 ---------- */
  /* ---------- Loading 屏 ---------- */
  .loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity .4s ease-out;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading-inner { text-align: center; }
  .loading-fish {
    font-size: 56px;
    animation: bobUp 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(91,227,194,.4));
  }
  @keyframes bobUp {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  .loading-text {
    margin-top: 14px;
    color: var(--text-2);
    font-size: var(--fs-md);
    letter-spacing: 2px;
  }
  .loading-bar {
    margin: 12px auto 0;
    width: 200px; height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    overflow: hidden;
    position: relative;
  }
  .loading-bar::before {
    content: ""; position: absolute; left: -40%; top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: loadingSweep 1.4s ease-in-out infinite;
  }
  @keyframes loadingSweep {
    from { left: -40%; } to { left: 100%; }
  }
/* ---------- <noscript> Fallback ---------- */
  .noscript-fallback {
    max-width: 480px; margin: 18vh auto;
    padding: 32px 28px;
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.3);
    border-radius: 16px;
    text-align: center;
    color: var(--text);
  }
  .noscript-fallback h1 {
    font-size: 24px; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .noscript-fallback p {
    color: var(--text-2);
    font-size: 14px; line-height: 1.7;
    margin-bottom: 8px;
  }</style>
</head>
<body>

  <!-- 顶部 -->
  <div class="hud">
    <div class="left">
      <div class="title">🎣 湖畔垂钓</div>
      <div class="chip">💰 <b id="hud-money">0</b> 金币</div>
      <div class="chip">Lv.<b id="hud-level">1</b>
        <div class="xp-bar"><i id="hud-xp"></i></div>
      </div>
      <div class="chip" id="hud-weather">☀ 晴</div>
    </div>
    <div class="right">
      <div class="chip">📍 <b id="hud-place">青石湖</b></div>
      <div class="chip">⏱ <b id="hud-time">清晨</b></div>
      <button class="btn" id="btn-save">💾 存档</button>
      <button class="btn" id="btn-reset">♻ 重开</button>
    </div>
  </div>

  <!-- 主舞台：3D 场景 -->
  <div class="stage" id="stage">
    <canvas id="three-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;"></canvas>
    <!-- 飘字/浮提示保留为 DOM 叠层 -->
    <div class="hint" id="hint">选择地点与鱼饵，按下「抛竿」开始 🎣</div>
  </div>

  <!-- 底部 -->
  <div class="controls">
    <div class="col">
      <h5>鱼饵</h5>
      <div class="bait-grid" id="bait-grid"></div>
    </div>
    <div class="col">
      <h5>行动</h5>
      <div class="action-grid">
        <div class="cast-power">
          <input type="range" id="power" min="0" max="100" value="60"/>
          <small>力度：<b id="power-val">60</b>（影响上鱼距离与稀有度加成）</small>
        </div>
        <button class="big-cast" id="cast">🎣 抛竿</button>
        <button class="btn" id="reel" disabled>↩ 收线</button>
      </div>
    </div>
    <div class="col">
      <h5>本局</h5>
      <div class="stats-mini">
        <span>捕获</span><b id="stat-catch">0</b>
        <span>最重</span><b id="stat-heaviest">—</b>
        <span>总收入</span><b id="stat-earn">0</b>
        <span>出竿</span><b id="stat-cast">0</b>
        <span>逃跑</span><b id="stat-escape">0</b>
        <span>命中率</span><b id="stat-hit">—</b>
      </div>
    </div>
  </div>

  <!-- 右侧浮按钮 -->
  <div class="right-stack">
    <div class="side-btn" data-modo="places"><span class="ico">📍</span>地点</div>
    <div class="side-btn" data-modo="logs"><span class="ico">📜</span>日志</div>
    <div class="side-btn" data-modo="codex"><span class="ico">📖</span>图鉴</div>
    <div class="side-btn" data-modo="shop"><span class="ico">🛒</span>商店</div>
    <div class="side-btn" data-modo="achv"><span class="ico">🏅</span>成就</div>
    <div class="side-btn" data-modo="help"><span class="ico">❓</span>玩法</div>
  </div>

  <!-- 左侧：地点 -->
  <div class="panel left-panel">
    <header>钓鱼地点</header>
    <div class="body">
      <div class="place-list" id="place-list"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <header>
        <div id="modal-title">题库</div>
        <div class="close" id="modal-close">✕</div>
      </header>
      <div class="body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Loading 屏 -->
  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-fish">🐟</div>
      <div class="loading-text">湖畔垂钓 · 加载中</div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- 新手引导 -->
  <div class="onboard-mask" id="onboard">
    <div class="onboard-card">
      <div class="onboard-step" id="onboard-step">STEP 1 / 6</div>
      <div class="onboard-title" id="onboard-title">选一个钓鱼地点</div>
      <div class="onboard-desc" id="onboard-desc">左侧面板列出可用的钓鱼点。</div>
      <div class="onboard-progress" id="onboard-progress"></div>
      <div class="onboard-actions">
        <span class="onboard-skip" id="onboard-skip">跳过引导</span>
        <button class="onboard-btn primary" id="onboard-next">下一步 →</button>
      </div>
    </div>
  </div>


<script type="module" src="./src/main.js"></script>
<script>window.__storagePrefix = 'fishing_mobile';</script>

  <noscript>
    <div class="noscript-fallback">
      <h1>🎣 湖畔垂钓</h1>
      <p>本游戏需要 JavaScript 与 WebGL 才能运行。</p>
      <p>请在浏览器中启用 JavaScript，或使用支持 WebGL 的现代浏览器（Chrome / Edge / Firefox / Safari）。</p>
    </div>
  </noscript>
</body>
</html>
