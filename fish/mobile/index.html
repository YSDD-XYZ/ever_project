<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a2b" media="(prefers-color-scheme: dark)" />
<title>湖畔垂钓 · 触屏版</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<!-- importmap：把 three 映射到本地 vendor。避免 CDN 不可用 / CORS 问题 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<style>
  /* ==========================================================
        设计系统（Design Tokens）
        ========================================================== */
  :root {
    /* 色板 */
    --bg:        #08111d;
    --surface:   rgba(20, 38, 64, 0.62);
    --surface-2: rgba(255, 255, 255, 0.04);
    --border:    rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text:      #eaf3ff;
    --text-2:    #9fb1c6;
    --text-3:    #6c8197;
    --primary:   #5be3c2;        /* 青绿 - CTA、强调 */
    --primary-2: #7ad7ff;        /* 天蓝 - 副强调 */
    --accent:    #ffd166;        /* 暖黄 - 数值 */
    --danger:    #ff7676;
    --success:   #7be39c;

    /* 间距 */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* 圆角 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;

    /* 阴影 */
    --shadow-1: 0 4px 12px rgba(0,0,0,.35);
    --shadow-2: 0 12px 40px rgba(0,0,0,.5);
    --shadow-3: 0 24px 64px rgba(0,0,0,.55);

    /* 字号 */
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
    --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px; --fs-display: 32px;
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: 60px 1fr 132px;
    background:
      radial-gradient(ellipse at 20% 0%, #1f3f66 0%, var(--bg) 60%),
      linear-gradient(180deg, var(--bg) 0%, #050b14 100%);
  }

  /* ---------- 顶部 HUD：单行玻璃条 ---------- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    z-index: 5;
    background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 100%);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    pointer-events: none;  /* 整个 HUD 不挡 3D 拖动 */
  }
  .hud > * { pointer-events: auto; }
  .hud-left { display: flex; align-items: center; gap: 10px; }
  /* 金币 */
  .coin {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    background: linear-gradient(135deg, rgba(255,209,102,.22), rgba(255,140,80,.18));
    border: 1px solid rgba(255,209,102,.4);
    border-radius: var(--r-pill);
    box-shadow: 0 2px 8px rgba(255,180,80,.15);
  }
  .coin-em { font-size: 14px; }
  .coin b {
    color: #ffe28a; font-weight: 800; font-size: 15px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    min-width: 1.5em; text-align: right;
  }
  /* 等级 + XP */
  .lv {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 12px;
    background: linear-gradient(135deg, rgba(91,227,194,.18), rgba(122,215,255,.14));
    border: 1px solid rgba(91,227,194,.35);
    border-radius: var(--r-pill);
    color: var(--primary);
    font-size: 12px; font-weight: 700;
  }
  .lv b { color: #fff; font-weight: 800; }
  .xp-track {
    display: inline-block; width: 50px; height: 5px;
    background: rgba(255,255,255,.12);
    border-radius: var(--r-pill); overflow: hidden;
    position: relative; vertical-align: middle;
  }
  .xp-track > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    transition: width .4s;
  }
  /* 齿轮按钮 */
  .gear {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s;
  }
  .gear:active { background: rgba(91,227,194,.2); transform: rotate(60deg); }

  /* ---------- 左下角：环境信息 ---------- */
  .env {
    position: fixed; left: 12px; bottom: 200px;
    display: flex; flex-direction: column; gap: 4px;
    z-index: 4;
    pointer-events: none;
  }
  .env-item {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    color: var(--text-2);
    font-size: 11px;
    pointer-events: auto;
  }
  .env-item b { color: var(--text); font-weight: 600; }

  /* ---------- 顶部条幅 hint（替代 stage 中央文字） ---------- */
  .hint {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--r-pill);
    color: var(--text);
    font-size: 12px;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
  }
  .hint.show { opacity: 1; }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: var(--fs-md);
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #2a6fa5 0%, #143457 60%, #0a1e36 100%);
  }

  /* 浮漂动画 */
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  @keyframes nibble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-14px) rotate(-6deg); } }
  @keyframes bite   { 0%{transform: translateY(-6px);} 40%{transform: translateY(20px);} 100%{transform: translateY(0);} }
  @keyframes shake  { 0%,100%{ transform: translateX(0);} 25%{transform:translateX(-3px);}75%{transform:translateX(3px);} }

  /* 飘字 */
  .float-text {
    position:absolute; font-weight:800; font-size:var(--fs-xl);
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    animation: floatUp 1.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp {
    from { opacity:1; transform:translate(-50%,0); }
    to   { opacity:0; transform:translate(-50%,-60px); }
  }

  /* ---------- 面板（卡片） ---------- */
  .panel {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .panel header {
    padding: 12px 16px; font-weight: 700; letter-spacing: 1px;
    font-size: var(--fs-md);
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel .body { padding: 14px 16px; }

  /* ---------- 地点面板（mobile 专用：抽屉 + 半透明背景） ---------- */
  .place-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: 49; opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .place-backdrop.show { opacity: 1; pointer-events: auto; }
  .left-panel {
    left: 0; top: 0; bottom: 0;
    width: 84vw; max-width: 360px;
    border-radius: 0;
    border-right: 1px solid var(--border-strong);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform .25s cubic-bezier(.2, .8, .3, 1);
    overflow-y: auto;
    box-shadow: 4px 0 24px rgba(0,0,0,.4);
  }
  .left-panel.open { transform: translateX(0); }
  .place-list { display: grid; gap: 10px; }
  .place {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    position: relative;
  }
  .place:hover {
    background: rgba(255,255,255,.07);
    border-color: var(--border-strong);
  }
  .place.active {
    border-color: var(--primary);
    background: rgba(91,227,194,.10);
  }
  .place.locked {
    opacity: .55; cursor: not-allowed;
    border-style: dashed;
  }
  .place.locked::before {
    content: '🔒';
    position: absolute; top: 8px; right: 8px;
    font-size: 14px;
  }
  .place-req {
    font-size: 10px; color: var(--text-3);
    margin-top: 4px;
  }
  .place.locked::before {
    content: '🔒';
    position: absolute; top: 8px; right: 8px;
    font-size: 14px;
  }
  .place.locked:hover { transform: none; }
  .place.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(91,227,194,.08), rgba(255,255,255,.02));
    box-shadow: 0 0 0 1px var(--primary) inset;
  }
  .place.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--primary); border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .place h4 {
    font-size: var(--fs-base); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .place p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; }
  .place .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 500;
  }
  .tag.lock { opacity:.45; }
  .tag.req { color: var(--accent); }
  .tag.weather-晴{color:#ffd166;} .tag.weather-雨{color:var(--primary-2);}
  .tag.weather-雾{color:#cfd6e4;} .tag.weather-雪{color:#e0eaff;}

  /* ---------- FAB 菜单（从齿轮按钮弹出） ---------- */
  .fab-menu {
    position: fixed; top: 60px; right: 12px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 8;
    opacity: 0; transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: 180px;
  }
  .fab-menu.open {
    opacity: 1; transform: translateY(0);
    pointer-events: auto;
  }
  .fab-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    background: rgba(15, 28, 50, .95);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-pill);
    color: var(--text);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    transition: background .15s, transform .15s;
  }
  .fab-item:active { background: rgba(91,227,194,.2); transform: scale(.97); }
  .fab-item .ico { font-size: 16px; }
  .fab-item.fab-danger { color: var(--danger); }
  .fab-divider {
    height: 1px; background: var(--border);
    margin: 4px 6px;
  }
  .fab-backdrop {
    position: fixed; inset: 0;
    z-index: 7; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .fab-backdrop.show { opacity: 1; pointer-events: auto; }

  /* ---------- 折叠式统计抽屉（左下角） ---------- */
  .stats-drawer {
    position: fixed; left: 12px; top: 56px;
    background: rgba(15, 28, 50, .88);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 4;
    min-width: 110px;
  }
  .stats-drawer summary {
    list-style: none;
    padding: 5px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-2);
    user-select: none;
  }
  .stats-drawer summary::-webkit-details-marker { display: none; }
  .stats-drawer summary .ico { font-size: 13px; }
  .stats-drawer summary .chev { margin-left: auto; transition: transform .2s; font-size: 10px; }
  .stats-drawer[open] summary .chev { transform: rotate(180deg); }
  .stats-drawer .stats-mini {
    padding: 6px 10px 8px;
    border-top: 1px solid var(--border);
    grid-template-columns: repeat(2, auto);
    gap: 3px 12px;
    font-size: 10px;
    display: grid;
  }
  .stats-drawer .stats-mini b { color: var(--accent); }

  /* ---------- 底部控制区：鱼饵 + 抛杆 + 力度 ---------- */
  .controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 8px 12px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.02) 0%, rgba(0,0,0,.7) 100%);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column; gap: 10px;
    z-index: 5;
  }

  /* 鱼饵：圆形图标横滑（更游戏化） */
  .bait-row {
    display: flex; gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 4px 4px 6px;
    justify-content: center;
  }
  .bait-row::-webkit-scrollbar { display: none; }
  .bait {
    flex: 0 0 auto;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    background: rgba(255,255,255,.06);
    transition: all .15s;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    scroll-snap-align: center;
  }
  .bait .emoji { font-size: 24px; line-height: 1; pointer-events: none; }
  .bait .cnt {
    position: absolute; top: -2px; right: -2px;
    min-width: 18px; height: 18px; padding: 0 4px;
    background: var(--accent);
    color: #2c1206;
    font-size: 10px; font-weight: 800;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #0b1a2b;
    line-height: 1;
  }
  .bait:hover { background: rgba(255,255,255,.12); }
  .bait.active {
    border-color: var(--primary);
    background: linear-gradient(135deg, rgba(91,227,194,.2), rgba(122,215,255,.15));
    box-shadow: 0 0 0 3px rgba(91,227,194,.18), 0 4px 12px rgba(91,227,194,.3);
    transform: translateY(-2px);
  }
  .bait.disabled { opacity: .35; cursor: not-allowed; }
  .bait .nm { display: none; }   /* 隐藏名字（只显示图标 + 数量徽章） */

  /* 抛杆 / 收线 / 力度 组合行 */
  .cast-bar {
    display: grid; grid-template-columns: 56px 1fr 56px;
    gap: 16px; align-items: center;
    justify-content: center;
  }
  /* 抛杆：巨圆按钮 + 内嵌 SVG 圆环 */
  .cast-btn {
    position: relative;
    width: 84px; height: 84px;
    margin: 0 auto;
    border-radius: 50%;
    border: none; cursor: pointer;
    background: radial-gradient(circle at 50% 35%, #ffcb80 0%, #ff7a59 70%, #d04a30 100%);
    box-shadow:
      0 0 0 4px rgba(255,140,80,.15),
      0 8px 24px rgba(255,90,40,.5),
      inset 0 -4px 8px rgba(0,0,0,.25),
      inset 0 4px 8px rgba(255,255,255,.2);
    transition: transform .1s, box-shadow .15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #2c1206;
    -webkit-tap-highlight-color: transparent;
  }
  .cast-btn:active { transform: scale(.94); }
  .cast-btn:disabled { filter: grayscale(.7); opacity: .6; cursor: not-allowed; }
  .cast-svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(0deg); pointer-events: none; }
  .cast-svg .ring-bg { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 3; }
  .cast-svg .ring-fill {
    fill: none; stroke: #5be3c2; stroke-width: 4;
    stroke-dasharray: 289; stroke-dashoffset: 289;
    stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: center;
    transition: stroke-dashoffset .1s linear;
  }
  .cast-icon { font-size: 28px; line-height: 1; margin-top: -2px; pointer-events: none; }
  .cast-text { font-size: 10px; font-weight: 800; letter-spacing: 1px; margin-top: 2px; pointer-events: none; }

  /* 收线按钮（圆形辅助） */
  .reel-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(91,227,194,.15);
    border: 2px solid var(--primary);
    color: var(--primary);
    font-size: 22px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .reel-btn:not(:disabled):active { background: rgba(91,227,194,.3); transform: scale(.94); }
  .reel-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* 力度：圆形按钮（中间数字 + 外圈弧形进度） */
  .power-btn {
    position: relative;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(15, 28, 50, .88);
    border: 1px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .power-btn:active { background: rgba(91,227,194,.2); }
  .power-btn svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .power-btn .arc-bg {
    fill: none; stroke: rgba(255,255,255,.12); stroke-width: 3;
  }
  .power-btn .arc-fill {
    fill: none; stroke: url(#power-grad); stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dasharray .15s;
  }
  .power-btn .power-label {
    position: relative; z-index: 1;
    color: var(--accent);
    font-weight: 800; font-size: 14px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  /* ---------- 统计区 ---------- */
  .stats-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: var(--fs-md);
    align-content: center;
  }
  .stats-mini > span { color: var(--text-3); font-size: var(--fs-sm); }

  /* ---------- 响应式 ---------- */
  @media (min-width: 720px) {
    .hud { padding: 12px 24px; }
    .coin b { font-size: 17px; }
    .lv { font-size: 13px; }
    .cast-btn { width: 96px; height: 96px; }
    .bait { width: 56px; height: 56px; }
    .bait .emoji { font-size: 26px; }
    .reel-btn, .power-btn { width: 56px; height: 56px; }
    .left-panel { width: 360px; }
  }
  @media (max-width: 360px) {
    .bait { width: 46px; height: 46px; }
    .bait .emoji { font-size: 22px; }
    .cast-btn { width: 76px; height: 76px; }
    .reel-btn, .power-btn { width: 46px; height: 46px; }
  }

  /* ---------- 新手引导 ---------- */
  .onboard-mask {
    position: fixed; inset: 0;
    z-index: 90;
    background: rgba(5, 10, 18, .55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 100px;
  }
  .onboard-mask.show { display: flex; }
  .onboard-card {
    width: min(440px, 92vw);
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.4);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    padding: 22px 22px 16px;
    position: relative;
    animation: onboardPop .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes onboardPop {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .onboard-step {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .onboard-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .onboard-desc {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .onboard-progress {
    display: flex; gap: 4px;
    margin-bottom: 14px;
  }
  .onboard-dot {
    flex: 1; height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    transition: background .25s;
  }
  .onboard-dot.active { background: var(--primary); }
  .onboard-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .onboard-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    transition: all .15s;
  }
  .onboard-btn:hover { background: rgba(255,255,255,.12); }
  .onboard-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .onboard-skip {
    font-size: 12px;
    color: var(--text-3);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .onboard-skip:hover { color: var(--text-2); }

  /* 高亮：被指引的元素 */
  .onboard-highlight {
    position: relative;
    z-index: 91;
    box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary) !important;
    border-radius: var(--r-md);
    animation: onboardPulse 1.5s ease-in-out infinite;
  }
  @keyframes onboardPulse {
    0%,100% { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary); }
    50%     { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 10px var(--primary); }
  }

  /* ---------- 中央提示条 ---------- */
  /* ---------- Loading 屏 ---------- */
  .loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity .4s ease-out;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading-inner { text-align: center; }
  .loading-fish {
    font-size: 56px;
    animation: bobUp 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(91,227,194,.4));
  }
  @keyframes bobUp {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  .loading-text {
    margin-top: 14px;
    color: var(--text-2);
    font-size: var(--fs-md);
    letter-spacing: 2px;
  }
  .loading-bar {
    margin: 12px auto 0;
    width: 200px; height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    overflow: hidden;
    position: relative;
  }
  .loading-bar::before {
    content: ""; position: absolute; left: -40%; top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: loadingSweep 1.4s ease-in-out infinite;
  }
  @keyframes loadingSweep {
    from { left: -40%; } to { left: 100%; }
  }
/* ---------- <noscript> Fallback ---------- */
  .noscript-fallback {
    max-width: 480px; margin: 18vh auto;
    padding: 32px 28px;
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.3);
    border-radius: 16px;
    text-align: center;
    color: var(--text);
  }
  .noscript-fallback h1 {
    font-size: 24px; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .noscript-fallback p {
    color: var(--text-2);
    font-size: 14px; line-height: 1.7;
    margin-bottom: 8px;
  </style>

  <!-- 渐变定义（被 SVG 引用） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="power-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7ad7ff"/>
        <stop offset="100%" stop-color="#ffd166"/>
      </linearGradient>
    </defs>
  </svg>
</head>
<body>

  <!-- 顶部 HUD：单行玻璃条 -->
  <div class="hud">
    <div class="hud-left">
      <span class="coin"><span class="coin-em">💰</span><b id="hud-money">0</b></span>
      <span class="lv">Lv.<b id="hud-level">1</b><i class="xp-track"><i id="hud-xp"></i></i></span>
    </div>
    <button class="gear" id="btn-menu" aria-label="设置">⚙</button>
  </div>

  <!-- 主舞台：3D 场景（占满，去掉中央文字） -->
  <div class="stage" id="stage">
    <canvas id="three-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;"></canvas>
  </div>

  <!-- 左下角：环境信息（地点 / 天气 / 时段） -->
  <div class="env">
    <span class="env-item" id="env-place">📍 <b id="hud-place">青石湖</b></span>
    <span class="env-item" id="env-weather">☀ 晴</span>
    <span class="env-item" id="env-time">⏱ 清晨</span>
  </div>

  <!-- 顶部飘字 hint（条幅） -->
  <div class="hint" id="hint">选择地点与鱼饵，按下「抛竿」开始 🎣</div>

  <!-- 底部：鱼饵 + 抛杆 + 收线 -->
  <div class="controls">
    <!-- 鱼饵圆形图标行 -->
    <div class="bait-row" id="bait-row"></div>

    <!-- 抛杆按钮（巨大圆形 + 内嵌 cooldown 环）+ 收线 -->
    <div class="cast-bar">
      <button class="reel-btn" id="reel" disabled>↩ 收线</button>
      <button class="cast-btn" id="cast" aria-label="抛竿">
        <svg class="cast-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" class="ring-bg"/>
          <circle id="cast-ring-fill" cx="50" cy="50" r="46" class="ring-fill"
                  transform="rotate(-90 50 50)"/>
        </svg>
        <span class="cast-icon">🎣</span>
        <span class="cast-text">抛竿</span>
      </button>
      <button class="power-btn" id="power-btn" aria-label="调整力度">
        <svg viewBox="0 0 100 100">
          <path id="power-arc" d="" class="arc-bg"/>
          <path id="power-arc-fill" d="" class="arc-fill"/>
        </svg>
        <span class="power-label"><b id="power-val">60</b></span>
      </button>
    </div>
  </div>

  <!-- 隐藏的 range（保持兼容） -->
  <input type="range" id="power" min="0" max="100" value="60" style="display:none"/>

  <!-- FAB 菜单（齿轮按钮触发） -->
  <div class="fab-menu" id="fab-menu">
    <button class="fab-item" data-modo="places"><span class="ico">📍</span><span>地点</span></button>
    <button class="fab-item" data-modo="logs"><span class="ico">📜</span><span>日志</span></button>
    <button class="fab-item" data-modo="codex"><span class="ico">📖</span><span>图鉴</span></button>
    <button class="fab-item" data-modo="shop"><span class="ico">🛒</span><span>商店</span></button>
    <button class="fab-item" data-modo="achv"><span class="ico">🏅</span><span>成就</span></button>
    <button class="fab-item" data-modo="help"><span class="ico">❓</span><span>玩法</span></button>
    <div class="fab-divider"></div>
    <button class="fab-item" id="fab-save"><span class="ico">📤</span><span>导出</span></button>
    <button class="fab-item" id="fab-load"><span class="ico">📥</span><span>导入</span></button>
    <button class="fab-item" id="fab-slots"><span class="ico">📚</span><span>存档</span></button>
    <button class="fab-item fab-danger" id="fab-reset"><span class="ico">♻</span><span>重开</span></button>
  </div>
  <div class="fab-backdrop" id="fab-backdrop"></div>

  <!-- 折叠式统计抽屉（紧贴右上齿轮下方） -->
  <details class="stats-drawer" id="stats-drawer">
    <summary>
      <span class="ico">📊</span>
      <span>本局</span>
      <span class="chev">▾</span>
    </summary>
    <div class="stats-mini">
      <span>捕获</span><b id="stat-catch">0</b>
      <span>最重</span><b id="stat-heaviest">—</b>
      <span>总收入</span><b id="stat-earn">0</b>
      <span>出竿</span><b id="stat-cast">0</b>
      <span>逃跑</span><b id="stat-escape">0</b>
      <span>命中率</span><b id="stat-hit">—</b>
    </div>
  </details>

  <!-- 左侧抽屉背景 -->
  <div class="place-backdrop" id="place-backdrop"></div>

  <!-- 左侧：地点 -->
  <div class="panel left-panel">
    <header>钓鱼地点</header>
    <div class="body">
      <div class="place-list" id="place-list"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <header>
        <div id="modal-title">题库</div>
        <div class="close" id="modal-close">✕</div>
      </header>
      <div class="body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Loading 屏 -->
  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-fish">🐟</div>
      <div class="loading-text">湖畔垂钓 · 加载中</div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- 新手引导 -->
  <div class="onboard-mask" id="onboard">
    <div class="onboard-card">
      <div class="onboard-step" id="onboard-step">STEP 1 / 6</div>
      <div class="onboard-title" id="onboard-title">选一个钓鱼地点</div>
      <div class="onboard-desc" id="onboard-desc">左侧面板列出可用的钓鱼点。</div>
      <div class="onboard-progress" id="onboard-progress"></div>
      <div class="onboard-actions">
        <span class="onboard-skip" id="onboard-skip">跳过引导</span>
        <button class="onboard-btn primary" id="onboard-next">下一步 →</button>
      </div>
    </div>
  </div>


<script type="module" src="./src/main.js"></script>
<script>window.__storagePrefix = 'fishing_mobile';</script>

  <noscript>
    <div class="noscript-fallback">
      <h1>🎣 湖畔垂钓</h1>
      <p>本游戏需要 JavaScript 与 WebGL 才能运行。</p>
      <p>请在浏览器中启用 JavaScript，或使用支持 WebGL 的现代浏览器（Chrome / Edge / Firefox / Safari）。</p>
    </div>
  </noscript>
</body>
</html>
