      <stop offset="0" stop-color="#1a3a66"/>
      <stop offset="1" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5b86"/>
      <stop offset="1" stop-color="#0e3252"/>
