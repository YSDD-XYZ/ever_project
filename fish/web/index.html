<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>湖畔垂钓 · 轻松钓鱼</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!-- importmap：把 three 映射到本地 vendor。避免 CDN 不可用 / CORS 问题 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
<style>
  /* ==========================================================
        设计系统（Design Tokens）
        ========================================================== */
  :root {
    /* 色板 */
    --bg:        #08111d;
    --surface:   rgba(20, 38, 64, 0.62);
    --surface-2: rgba(255, 255, 255, 0.04);
    --border:    rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text:      #eaf3ff;
    --text-2:    #9fb1c6;
    --text-3:    #6c8197;
    --primary:   #5be3c2;        /* 青绿 - CTA、强调 */
    --primary-2: #7ad7ff;        /* 天蓝 - 副强调 */
    --accent:    #ffd166;        /* 暖黄 - 数值 */
    --danger:    #ff7676;
    --success:   #7be39c;

    /* 间距 */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* 圆角 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;

    /* 阴影 */
    --shadow-1: 0 4px 12px rgba(0,0,0,.35);
    --shadow-2: 0 12px 40px rgba(0,0,0,.5);
    --shadow-3: 0 24px 64px rgba(0,0,0,.55);

    /* 字号 */
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
    --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px; --fs-display: 32px;
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: 60px 1fr 132px;
    background:
      radial-gradient(ellipse at 20% 0%, #1f3f66 0%, var(--bg) 60%),
      linear-gradient(180deg, var(--bg) 0%, #050b14 100%);
  }

  /* ---------- 顶部 HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .hud .left, .hud .right { display: flex; align-items: center; gap: 10px; }
  .title {
    font-weight: 800; letter-spacing: 1.5px; font-size: var(--fs-xl);
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-right: 6px;
  }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 12px; border-radius: var(--r-pill);
    font-size: var(--fs-md); display: flex; align-items: center; gap: 6px;
    color: var(--text);
    transition: background .15s;
  }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip b { color: var(--accent); font-weight: 700; }
  .xp-bar {
    width: 100px; height: 6px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.08); overflow: hidden; position: relative;
  }
  .xp-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    transition: width .4s;
  }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: var(--fs-md);
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #2a6fa5 0%, #143457 60%, #0a1e36 100%);
  }

  /* 浮漂动画 */
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  @keyframes nibble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-14px) rotate(-6deg); } }
  @keyframes bite   { 0%{transform: translateY(-6px);} 40%{transform: translateY(20px);} 100%{transform: translateY(0);} }
  @keyframes shake  { 0%,100%{ transform: translateX(0);} 25%{transform:translateX(-3px);}75%{transform:translateX(3px);} }

  /* 飘字 */
  .float-text {
    position:absolute; font-weight:800; font-size:var(--fs-xl);
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    animation: floatUp 1.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp {
    from { opacity:1; transform:translate(-50%,0); }
    to   { opacity:0; transform:translate(-50%,-60px); }
  }

  /* ---------- 面板（卡片） ---------- */
  .panel {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .panel header {
    padding: 12px 16px; font-weight: 700; letter-spacing: 1px;
    font-size: var(--fs-md);
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel .body { padding: 14px 16px; }

  /* ---------- 地点面板 ---------- */
  .left-panel { left: 16px; top: 16px; width: 280px; }
  .place-list { display: grid; gap: 10px; }
  .place {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    position: relative;
  }
  .place:hover {
    background: rgba(255,255,255,.07);
    transform: translateX(2px);
    border-color: var(--border-strong);
  }
  .place.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(91,227,194,.08), rgba(255,255,255,.02));
    box-shadow: 0 0 0 1px var(--primary) inset;
  }
  .place.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--primary); border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .place h4 {
    font-size: var(--fs-base); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .place p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; }
  .place .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 500;
  }
  .tag.lock { opacity:.45; }
  .tag.req { color: var(--accent); }
  .tag.weather-晴{color:#ffd166;} .tag.weather-雨{color:var(--primary-2);}
  .tag.weather-雾{color:#cfd6e4;} .tag.weather-雪{color:#e0eaff;}

  /* ---------- 右侧浮按钮 ---------- */
  .right-stack {
    position: absolute; right: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .side-btn {
    width: 80px; padding: 10px 0; text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    cursor: pointer; transition: all .15s;
    font-size: var(--fs-sm); color: var(--text);
    backdrop-filter: blur(8px);
  }
  .side-btn:hover {
    background: rgba(255,255,255,.10);
    transform: translateY(-2px);
    border-color: var(--border-strong);
  }
  .side-btn:active { transform: translateY(0); }
  .side-btn .ico {
    font-size: 22px; display: block; margin-bottom: 2px;
    line-height: 1;
  }

  /* ---------- 底部控制区 ---------- */
  .controls {
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.35));
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 20px;
    padding: 14px 22px;
    backdrop-filter: blur(8px);
  }
  .col h5 {
    font-size: var(--fs-xs);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .bait-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .bait {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    font-size: var(--fs-sm);
    background: rgba(255,255,255,.03);
    transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .bait:hover {
    background: rgba(255,255,255,.08);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .bait.active {
    border-color: var(--accent);
    background: rgba(255, 209, 102, .10);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .bait.disabled { opacity: .35; cursor: not-allowed; }
  .bait .emoji { font-size: 22px; line-height: 1; }
  .bait .nm { font-weight: 700; color: var(--text); }
  .bait .cnt {
    font-size: var(--fs-xs); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
  }
  .cast-power { min-width: 0; }
  .cast-power input[type=range] {
    width: 100%; height: 4px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    -webkit-appearance: none; appearance: none;
    outline: none;
  }
  .cast-power input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(91,227,194,.15);
  }
  .cast-power input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer; border: none;
  }
  .cast-power small {
    display: block;
    color: var(--text-2);
    font-size: var(--fs-sm);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cast-power small b { color: var(--accent); font-weight: 700; }

  .big-cast {
    font-size: var(--fs-lg);
    padding: 14px 24px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, #ffb45e, #ff7a59);
    color: #2c1206; border: none; cursor: pointer; font-weight: 800;
    box-shadow: 0 8px 24px rgba(255,140,80,.35);
    transition: transform .1s, box-shadow .15s;
    white-space: nowrap;
  }
  .big-cast:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,140,80,.45); }
  .big-cast:active { transform: translateY(0); }
  .big-cast:disabled { filter: grayscale(.6); opacity:.6; cursor:not-allowed; transform:none; box-shadow: none; }

  /* ---------- 统计区 ---------- */
  .stats-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: var(--fs-md);
    align-content: center;
  }
  .stats-mini > span { color: var(--text-3); font-size: var(--fs-sm); }
  .stats-mini > b {
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(5, 10, 18, 0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: fadeIn .2s ease-out;
  }
  .modal-mask.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(20px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal {
    width: min(720px, 92vw); max-height: 86vh; overflow: auto;
    background: linear-gradient(180deg, #11233e, #0a1729);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-3);
    animation: popIn .25s cubic-bezier(.2, .9, .3, 1.2);
  }
  .modal header {
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: var(--fs-lg);
  }
  .modal .close {
    cursor: pointer;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    color: var(--text-2);
    transition: all .15s;
  }
  .modal .close:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .modal .body { padding: 18px 20px; }

  /* ---------- 图鉴 ---------- */
  .codex {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .codex-item {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    background: rgba(255,255,255,.03);
    display: flex; gap: 12px; align-items: center;
    transition: all .15s;
  }
  .codex-item:hover {
    background: rgba(255,255,255,.07);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .codex-item.unknown { filter: grayscale(.85) brightness(.6); }
  .codex-item .emoji {
    font-size: 32px; line-height: 1;
    background: rgba(255,255,255,.05);
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .codex-item .nm { font-weight: 700; font-size: var(--fs-base); }
  .codex-item .rarity {
    font-size: var(--fs-xs); color: var(--accent);
    font-weight: 600; margin-top: 2px;
  }
  .codex-item .stat {
    font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 商店 ---------- */
  .shop-list { display: grid; gap: 10px; }
  .shop-row {
    display: grid;
    grid-template-columns: 48px 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 12px 14px;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    transition: all .15s;
  }
  .shop-row:hover { background: rgba(255,255,255,.07); border-color: var(--border-strong); }
  .shop-row .emoji {
    font-size: 24px; text-align: center;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.05);
    border-radius: var(--r-sm);
  }
  .shop-row .nm { font-weight: 700; font-size: var(--fs-base); }
  .shop-row .desc {
    font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px;
  }
  .shop-row .price {
    color: var(--accent); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .shop-row.owned {
    background: rgba(91,227,194,.08);
    border-color: rgba(91,227,194,.3);
  }
  .shop-row.owned .price { color: var(--primary); }

  /* ---------- 成就 ---------- */
  .achv-list { display: grid; gap: 8px; }
  .achv {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: rgba(255,255,255,.03);
    transition: all .15s;
  }
  .achv:hover { background: rgba(255,255,255,.07); }
  .achv.done {
    background: rgba(255, 209, 102, .08);
    border-color: rgba(255, 209, 102, .3);
  }
  .achv .ico {
    font-size: 24px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.05);
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .achv.done .ico { background: rgba(255, 209, 102, .15); }
  .achv .nm { font-weight: 700; font-size: var(--fs-base); }
  .achv .ds { font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; }
  .achv .reward {
    color: var(--primary);
    font-size: var(--fs-sm); font-weight: 700;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 日志 ---------- */
  .log-list {
    font-size: var(--fs-md); line-height: 1.8;
    max-height: 60vh; overflow: auto;
    font-variant-numeric: tabular-nums;
  }
  .log-list > div {
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .log-list > div:last-child { border-bottom: none; }
  .log-list .ts { color: var(--text-3); margin-right: 8px; font-size: var(--fs-sm); }
  .log-list .ok  { color: var(--success); }
  .log-list .err { color: var(--danger); }
  .log-list .tip { color: var(--accent); }

  /* ---------- 捕获大卡 ---------- */
  .catch-card {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 16px;
    align-items: center;
    padding: 18px;
    background: linear-gradient(135deg, rgba(91,227,194,.12), rgba(122,215,255,.06));
    border-radius: var(--r-lg);
    border: 1px solid rgba(91,227,194,.4);
  }
  .catch-card .big-fish {
    font-size: 84px; text-align: center; line-height: 1;
    background: rgba(255,255,255,.05);
    border-radius: var(--r-md);
    padding: 14px 0;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));
  }
  .catch-card h3 {
    font-size: var(--fs-2xl);
    margin-bottom: 4px;
  }
  .catch-card .rarity {
    display: inline-block;
    background: rgba(255, 209, 102, .15);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: var(--r-pill);
    font-size: var(--fs-xs); font-weight: 700;
    margin-bottom: 8px;
  }
  .catch-card .flavor {
    font-size: var(--fs-md); color: var(--text-2);
    line-height: 1.6; margin-top: 8px;
  }
  .catch-card .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px 14px; margin-top: 12px;
    font-size: var(--fs-md);
  }
  .catch-card .stats > div > span {
    display: block;
    color: var(--text-3); font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .catch-card .stats > div > b {
    color: var(--text);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .catch-card .reward {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.1);
    color: var(--accent);
    font-weight: 700;
    font-size: var(--fs-lg);
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 170px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(15, 30, 50, .92);
    border: 1px solid var(--border-strong);
    padding: 10px 18px;
    border-radius: var(--r-pill);
    font-size: var(--fs-md);
    color: var(--text);
    box-shadow: var(--shadow-2);
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 60;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Loading 屏 ---------- */
  .loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity .4s ease-out;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading-inner { text-align: center; }
  .loading-fish {
    font-size: 56px;
    animation: bobUp 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(91,227,194,.4));
  }
  @keyframes bobUp {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  .loading-text {
    margin-top: 14px;
    color: var(--text-2);
    font-size: var(--fs-md);
    letter-spacing: 2px;
  }
  .loading-bar {
    margin: 12px auto 0;
    width: 200px; height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    overflow: hidden;
    position: relative;
  }
  .loading-bar::before {
    content: ""; position: absolute; left: -40%; top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: loadingSweep 1.4s ease-in-out infinite;
  }
  @keyframes loadingSweep {
    from { left: -40%; } to { left: 100%; }
  }

  /* ---------- 新手引导 ---------- */
  .onboard-mask {
    position: fixed; inset: 0;
    z-index: 90;
    background: rgba(5, 10, 18, .55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 100px;
  }
  .onboard-mask.show { display: flex; }
  .onboard-card {
    width: min(440px, 92vw);
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.4);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    padding: 22px 22px 16px;
    position: relative;
    animation: onboardPop .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes onboardPop {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .onboard-step {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .onboard-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .onboard-desc {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .onboard-progress {
    display: flex; gap: 4px;
    margin-bottom: 14px;
  }
  .onboard-dot {
    flex: 1; height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    transition: background .25s;
  }
  .onboard-dot.active { background: var(--primary); }
  .onboard-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .onboard-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    transition: all .15s;
  }
  .onboard-btn:hover { background: rgba(255,255,255,.12); }
  .onboard-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .onboard-skip {
    font-size: 12px;
    color: var(--text-3);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .onboard-skip:hover { color: var(--text-2); }

  /* 高亮：被指引的元素 */
  .onboard-highlight {
    position: relative;
    z-index: 91;
    box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary) !important;
    border-radius: var(--r-md);
    animation: onboardPulse 1.5s ease-in-out infinite;
  }
  @keyframes onboardPulse {
    0%,100% { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary); }
    50%     { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 10px var(--primary); }
  }

  /* ---------- 中央提示条 ---------- */
  .hint {
    position: absolute; left: 50%; top: 16px;
    transform: translateX(-50%);
    background: rgba(8, 18, 32, .85);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: var(--r-pill);
    font-size: var(--fs-md);
    color: var(--text);
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow-1);
    transition: opacity .3s;
  }

  /* ---------- 收线小游戏进度条 ---------- */
  .reel-bar {
    position: relative; height: 24px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    margin: 10px 0;
  }
  .reel-bar .zone {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    opacity: .8;
    box-shadow: 0 0 12px rgba(91,227,194,.6);
  }
  .reel-bar .cursor {
    position: absolute; top: -3px; bottom: -3px;
    width: 3px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1100px) {
    .left-panel { width: 240px; }
    .controls { grid-template-columns: 1fr 1.4fr 1fr; gap: 16px; }
  }
  @media (max-width: 900px) {
    .left-panel { width: 220px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .controls > .col:last-child { display: none; }
    .side-btn { width: 72px; padding: 8px 0; }
  }
</style>
</head>
<body>

  <!-- 顶部 -->
  <div class="hud">
    <div class="left">
      <div class="title">🎣 湖畔垂钓</div>
      <div class="chip">💰 <b id="hud-money">0</b> 金币</div>
      <div class="chip">Lv.<b id="hud-level">1</b>
        <div class="xp-bar"><i id="hud-xp"></i></div>
      </div>
      <div class="chip" id="hud-weather">☀ 晴</div>
    </div>
    <div class="right">
      <div class="chip">📍 <b id="hud-place">青石湖</b></div>
      <div class="chip">⏱ <b id="hud-time">清晨</b></div>
      <button class="btn" id="btn-save">💾 存档</button>
      <button class="btn" id="btn-reset">♻ 重开</button>
    </div>
  </div>

  <!-- 主舞台：3D 场景 -->
  <div class="stage" id="stage">
    <canvas id="three-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
    <!-- 飘字/浮提示保留为 DOM 叠层 -->
    <div class="hint" id="hint">选择地点与鱼饵，按下「抛竿」开始 🎣</div>
  </div>

  <!-- 底部 -->
  <div class="controls">
    <div class="col">
      <h5>鱼饵</h5>
      <div class="bait-grid" id="bait-grid"></div>
    </div>
    <div class="col">
      <h5>行动</h5>
      <div class="action-grid">
        <div class="cast-power">
          <input type="range" id="power" min="0" max="100" value="60"/>
          <small>力度：<b id="power-val">60</b>（影响上鱼距离与稀有度加成）</small>
        </div>
        <button class="big-cast" id="cast">🎣 抛竿</button>
        <button class="btn" id="reel" disabled>↩ 收线</button>
      </div>
    </div>
    <div class="col">
      <h5>本局</h5>
      <div class="stats-mini">
        <span>捕获</span><b id="stat-catch">0</b>
        <span>最重</span><b id="stat-heaviest">—</b>
        <span>总收入</span><b id="stat-earn">0</b>
        <span>出竿</span><b id="stat-cast">0</b>
        <span>逃跑</span><b id="stat-escape">0</b>
        <span>命中率</span><b id="stat-hit">—</b>
      </div>
    </div>
  </div>

  <!-- 右侧浮按钮 -->
  <div class="right-stack">
    <div class="side-btn" data-modo="logs"><span class="ico">📜</span>日志</div>
    <div class="side-btn" data-modo="codex"><span class="ico">📖</span>图鉴</div>
    <div class="side-btn" data-modo="shop"><span class="ico">🛒</span>商店</div>
    <div class="side-btn" data-modo="achv"><span class="ico">🏅</span>成就</div>
    <div class="side-btn" data-modo="help"><span class="ico">❓</span>玩法</div>
  </div>

  <!-- 左侧：地点 -->
  <div class="panel left-panel">
    <header>钓鱼地点</header>
    <div class="body">
      <div class="place-list" id="place-list"></div>
    </div>
  </div>

  <!-- 模态框 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <header>
        <div id="modal-title">题库</div>
        <div class="close" id="modal-close">✕</div>
      </header>
      <div class="body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Loading 屏：在 scene 渲染就绪前显示 -->
  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-fish">🐟</div>
      <div class="loading-text">湖畔垂钓 · 加载中</div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- 新手引导（首次进入展示） -->
  <div class="onboard-mask" id="onboard">
    <div class="onboard-card">
      <div class="onboard-step" id="onboard-step">STEP 1 / 6</div>
      <div class="onboard-title" id="onboard-title">选一个钓鱼地点</div>
      <div class="onboard-desc" id="onboard-desc">左侧面板列出可用的钓鱼点，每个地点有不同的解锁条件、鱼种和天气偏好。</div>
      <div class="onboard-progress" id="onboard-progress"></div>
      <div class="onboard-actions">
        <span class="onboard-skip" id="onboard-skip">跳过引导</span>
        <button class="onboard-btn primary" id="onboard-next">下一步 →</button>
      </div>
    </div>
  </div>


</body>
</html>
