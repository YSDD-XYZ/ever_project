<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>湖畔垂钓 · 轻松钓鱼</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!-- importmap：2D 场景无外部依赖 -->
<script>
  // 如果没带 ?play=1 参数,显示项目集入口链接(不是强制跳转,避免游戏体验被破坏)
  if (!new URL(location.href).searchParams.has('play') && !sessionStorage.getItem('__fishSeen')) {
    sessionStorage.setItem('__fishSeen', '1');
  }
</script>
<script type="module" src="./src/main.js"></script>
<script>window.__storagePrefix = 'fishing_web';</script>
<style>
  /* ---------- 顶部项目导航(菜单栏胶囊) ---------- */
  .portal-nav {
    position: fixed; top: 12px; left: 12px; z-index: 999;
    display: flex; gap: 2px;
    padding: 4px;
    background: rgba(8,17,29,.85);
    border: 1px solid var(--border);
    border-radius: 8px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .portal-nav a {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    color: var(--text-2);
    transition: background .12s, color .12s;
  }
  .portal-nav a:hover { background: rgba(91,227,194,.1); color: var(--primary); }
  .portal-nav a.active { background: rgba(91,227,194,.18); color: var(--primary); font-weight: 700; }
  .portal-nav .sep { width: 1px; background: var(--border); margin: 4px 4px; }
  .portal-nav .close { color: var(--text-3); }
  .portal-nav .close:hover { color: var(--danger); background: rgba(255,107,107,.1); }
</style>
<style>
  /* ==========================================================
        设计系统（Design Tokens）
        ========================================================== */
  :root {
    /* 色板 */
    --bg:        #08111d;
    --surface:   rgba(20, 38, 64, 0.62);
    --surface-2: rgba(255, 255, 255, 0.04);
    --border:    rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text:      #eaf3ff;
    --text-2:    #9fb1c6;
    --text-3:    #6c8197;
    --primary:   #5be3c2;        /* 青绿 - CTA、强调 */
    --primary-2: #7ad7ff;        /* 天蓝 - 副强调 */
    --accent:    #ffd166;        /* 暖黄 - 数值 */
    --danger:    #ff7676;
    --success:   #7be39c;

    /* 间距 */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* 圆角 */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;

    /* 阴影 */
    --shadow-1: 0 4px 12px rgba(0,0,0,.35);
    --shadow-2: 0 12px 40px rgba(0,0,0,.5);
    --shadow-3: 0 24px 64px rgba(0,0,0,.55);

    /* 字号 */
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
    --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px; --fs-display: 32px;
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: 60px 1fr 132px;
    background:
      radial-gradient(ellipse at 20% 0%, #1f3f66 0%, var(--bg) 60%),
      linear-gradient(180deg, var(--bg) 0%, #050b14 100%);
  }

  /* ---------- 顶部 HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .hud .left, .hud .right { display: flex; align-items: center; gap: 10px; }
  .title {
    font-weight: 800; letter-spacing: 1.5px; font-size: var(--fs-xl);
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-right: 6px;
  }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 12px; border-radius: var(--r-pill);
    font-size: var(--fs-md); display: flex; align-items: center; gap: 6px;
    color: var(--text);
    transition: background .15s;
  }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip b { color: var(--accent); font-weight: 700; }
  .xp-bar {
    width: 100px; height: 6px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.08); overflow: hidden; position: relative;
  }
  .xp-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    transition: width .4s;
  }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: var(--fs-md);
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 主舞台：2D 插画风格 ---------- */
    .stage {
      position: relative; overflow: hidden;
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 50%, #4682b4 100%);
    }

    /* ---------- 2D 场景元素 ---------- */
    .sky {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .sky.weather-晴 { background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, transparent 100%); }
    .sky.weather-雨 { background: linear-gradient(180deg, #4a5568 0%, #718096 50%, transparent 100%); }
    .sky.weather-雾 { background: linear-gradient(180deg, #a0aec0 0%, #cbd5e0 50%, transparent 100%); }
    .sky.weather-雪 { background: linear-gradient(180deg, #cbd5e0 0%, #e2e8f0 50%, transparent 100%); }
    .far { position: absolute; inset: 0; pointer-events: none; }
    .sun, .moon {
      position: absolute; top: 8%; right: 15%;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd166 0%, #ffaa44 70%, transparent 100%);
      box-shadow: 0 0 40px rgba(255,209,102,.5);
    }
    .moon {
      background: radial-gradient(circle, #e2e8f0 0%, #a0aec0 70%, transparent 100%);
      box-shadow: 0 0 30px rgba(226,232,240,.4);
    }
    .cloud-cover {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(160,174,192,.7) 0%, transparent 60%);
    }
    .cloud {
      position: absolute;
      background: rgba(255,255,255,.85);
      border-radius: 50%;
      filter: blur(2px);
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute;
      background: inherit; border-radius: 50%;
    }
    .c1 { width: 80px; height: 24px; top: 15%; left: 10%; animation: drift 30s linear infinite; }
    .c1::before { width: 40px; height: 40px; top: -16px; left: 12px; }
    .c1::after  { width: 50px; height: 50px; top: -22px; right: 8px; }
    .c2 { width: 100px; height: 28px; top: 22%; left: 50%; animation: drift 40s linear infinite; animation-delay: -10s; }
    .c2::before { width: 50px; height: 50px; top: -22px; left: 16px; }
    .c2::after  { width: 60px; height: 60px; top: -28px; right: 12px; }
    .c3 { width: 70px; height: 20px; top: 8%; right: 20%; animation: drift 35s linear infinite; animation-delay: -20s; }
    .c3::before { width: 36px; height: 36px; top: -14px; left: 10px; }
    .c3::after  { width: 44px; height: 44px; top: -20px; right: 6px; }
    @keyframes drift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }
    .mountain {
      position: absolute; bottom: 35%;
      width: 0; height: 0;
      border-left: 80px solid transparent;
      border-right: 80px solid transparent;
      border-bottom: 100px solid rgba(72,84,96,.5);
    }
    .m1 { left: 5%; }
    .m2 { right: 8%; border-bottom-color: rgba(74,85,104,.4); border-left-width: 100px; border-right-width: 100px; border-bottom-width: 80px; }

    /* 水面 */
    .water {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 35%;
      background: linear-gradient(180deg, #4a90c8 0%, #2e6da4 50%, #1e4a7a 100%);
      overflow: hidden;
    }
    .water::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.1) 0%, transparent 50%, rgba(255,255,255,.1) 100%);
      animation: water-shimmer 4s ease-in-out infinite;
    }
    @keyframes water-shimmer {
      0%, 100% { opacity: .3; }
      50%      { opacity: .7; }
    }
    .wave-bg, .wave-fg {
      position: absolute; left: 0; right: 0; width: 200%;
      height: 30px;
    }
    .wave-bg { top: 0; animation: wave-drift 8s linear infinite; opacity: .4; }
    .wave-fg { top: 8px; animation: wave-drift 4s linear infinite; }
    @keyframes wave-drift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ripples {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .ripple {
      position: absolute; bottom: 30%;
      width: 8px; height: 8px;
      border: 2px solid rgba(255,255,255,.6);
      border-radius: 50%;
      transform: translateX(-50%) translateY(50%);
      animation: ripple-expand 1.8s ease-out forwards;
    }
    @keyframes ripple-expand {
      0%   { transform: translateX(-50%) translateY(50%) scale(.3); opacity: 1; }
      100% { transform: translateX(-50%) translateY(50%) scale(6); opacity: 0; }
    }

    /* 浮漂 */
    .bobber {
      position: absolute;
      left: var(--bx, 50%);
      bottom: 32%;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
    }
    .bobber-stick {
      position: absolute;
      left: 50%; top: -40px;
      width: 2px; height: 40px;
      background: linear-gradient(180deg, transparent 0%, #5be3c2 100%);
      transform: translateX(-50%);
    }
    .bobber-flag {
      position: absolute;
      left: 50%; top: -52px;
      font-size: 16px;
      transform: translateX(-50%);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
    }
    .bobber-float {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff7676 0%, #cc3333 100%);
      box-shadow:
        inset 0 -3px 6px rgba(0,0,0,.3),
        0 0 8px rgba(255,118,118,.4);
      border: 1.5px solid #fff;
      animation: bobber-idle 2.4s ease-in-out infinite;
    }
    @keyframes bobber-idle {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    .bobber.casting .bobber-float { animation: none; }
    .bobber.nibbling .bobber-float {
      animation: bobber-nibble 0.4s ease-in-out 3;
    }
    @keyframes bobber-nibble {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px) rotate(-8deg); }
    }
    .bobber.biting .bobber-float {
      animation: bobber-bite 0.3s ease-in 2;
    }
    @keyframes bobber-bite {
      0%   { transform: translateY(-4px); }
      40%  { transform: translateY(14px); }
      100% { transform: translateY(0); }
    }
    .bobber.hooked .bobber-float {
      background: radial-gradient(circle at 30% 30%, #ffd166 0%, #cc8800 100%);
      box-shadow: 0 0 16px rgba(255,209,102,.6);
    }

    /* 鱼在水下 */
    .fish-layer {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 30%;
      pointer-events: none;
      overflow: hidden;
    }
    .fish-shadow {
      position: absolute;
      left: var(--bx, 50%);
      bottom: 10%;
      transform: translateX(-50%) scaleX(-1);
      font-size: 36px;
      filter:
        drop-shadow(0 0 6px rgba(0,0,0,.4))
        hue-rotate(180deg) saturate(.5) brightness(.8);
      animation: fish-swim 2.5s ease-in-out infinite;
      opacity: .85;
    }
    @keyframes fish-swim {
      0%, 100% { transform: translateX(-50%) scaleX(-1) translateY(0); }
      50%      { transform: translateX(-50%) scaleX(-1) translateY(-8px); }
    }

    /* 鱼跳出水面 */
    .fish-jump {
      position: absolute;
      left: 50%; top: -30px;
      font-size: 36px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 4;
    }

    /* 水花 */
    .splash-layer, .particles {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .splash {
      position: absolute;
      bottom: 32%;
      transform: translateX(-50%) translateY(50%);
      font-size: 24px;
      z-index: 4;
      animation: splash-anim 0.8s ease-out forwards;
    }
    @keyframes splash-anim {
      0%   { transform: translateX(-50%) translateY(50%) scale(.5); opacity: 1; }
      100% { transform: translateX(-50%) translateY(-40px) scale(1.5); opacity: 0; }
    }

    /* 雨/雪/雾粒子 */
    .raindrop {
      position: absolute; top: -20px;
      width: 2px; height: 14px;
      background: linear-gradient(180deg, transparent, rgba(174,194,224,.6));
      border-radius: 1px;
      animation: rain-fall linear infinite;
    }
    @keyframes rain-fall {
      from { transform: translateY(0); }
      to   { transform: translateY(110vh); }
    }
    .snowflake {
      position: absolute; top: -10px;
      font-size: 12px;
      color: #fff;
      animation: snow-fall linear infinite;
    }
    @keyframes snow-fall {
      from { transform: translateY(0) translateX(0); }
      to   { transform: translateY(110vh) translateX(20px); }
    }
    .fog {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(203,213,224,.6) 0%, transparent 60%);
      backdrop-filter: blur(1px);
    }

    /* 浮漂动画（保留兼容） */
    @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
    @keyframes nibble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-14px) rotate(-6deg); } }
    @keyframes bite   { 0%{transform: translateY(-6px);} 40%{transform: translateY(20px);} 100%{transform: translateY(0);} }
    @keyframes shake  { 0%,100%{ transform: translateX(0);} 25%{transform:translateX(-3px);}75%{transform:translateX(3px);} }

  /* 飘字 */
  .float-text {
    position:absolute; font-weight:800; font-size:var(--fs-xl);
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    animation: floatUp 1.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp {
    from { opacity:1; transform:translate(-50%,0); }
    to   { opacity:0; transform:translate(-50%,-60px); }
  }

  /* ---------- 面板（卡片） ---------- */
  .panel {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .panel header {
    padding: 12px 16px; font-weight: 700; letter-spacing: 1px;
    font-size: var(--fs-md);
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel .body { padding: 14px 16px; }

  /* ---------- 地点面板 ---------- */
  .left-panel { left: 16px; top: 16px; width: 280px; }
  .place-list { display: grid; gap: 10px; }
  .place {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.03);
    transition: all .15s;
    position: relative;
  }
  .place:hover {
    background: rgba(255,255,255,.07);
    transform: translateX(2px);
    border-color: var(--border-strong);
  }
  .place.locked { opacity: .55; cursor: not-allowed; }
  .place.locked:hover { transform: none; }
  .place.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(91,227,194,.08), rgba(255,255,255,.02));
    box-shadow: 0 0 0 1px var(--primary) inset;
  }
  .place.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--primary); border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .place h4 {
    font-size: var(--fs-base); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .place p  { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.5; }
  .place .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 500;
  }
  .tag.lock { opacity:.45; }
  .tag.req { color: var(--accent); }
  .tag.weather-晴{color:#ffd166;} .tag.weather-雨{color:var(--primary-2);}
  .tag.weather-雾{color:#cfd6e4;} .tag.weather-雪{color:#e0eaff;}

  /* ---------- 右侧浮按钮 ---------- */
  .right-stack {
    position: absolute; right: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .side-btn {
    width: 80px; padding: 10px 0; text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    cursor: pointer; transition: all .15s;
    font-size: var(--fs-sm); color: var(--text);
    backdrop-filter: blur(8px);
  }
  .side-btn:hover {
    background: rgba(255,255,255,.10);
    transform: translateY(-2px);
    border-color: var(--border-strong);
  }
  .side-btn:active { transform: translateY(0); }
  .side-btn .ico {
    font-size: 22px; display: block; margin-bottom: 2px;
    line-height: 1;
  }

  /* ---------- 底部控制区 ---------- */
  .controls {
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.35));
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 20px;
    padding: 14px 22px;
    backdrop-filter: blur(8px);
  }
  .col h5 {
    font-size: var(--fs-xs);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .bait-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .bait {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    font-size: var(--fs-sm);
    background: rgba(255,255,255,.03);
    transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .bait:hover {
    background: rgba(255,255,255,.08);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .bait.active {
    border-color: var(--accent);
    background: rgba(255, 209, 102, .10);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .bait.disabled { opacity: .35; cursor: not-allowed; }
  .bait .emoji { font-size: 22px; line-height: 1; }
  .bait .nm { font-weight: 700; color: var(--text); }
  .bait .cnt {
    font-size: var(--fs-xs); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
  }
  .cast-power { min-width: 0; }
  .cast-power input[type=range] {
    width: 100%; height: 4px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    -webkit-appearance: none; appearance: none;
    outline: none;
  }
  .cast-power input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(91,227,194,.15);
  }
  .cast-power input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer; border: none;
  }
  .cast-power small {
    display: block;
    color: var(--text-2);
    font-size: var(--fs-sm);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cast-power small b { color: var(--accent); font-weight: 700; }

  .big-cast {
    font-size: var(--fs-lg);
    padding: 14px 24px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, #ffb45e, #ff7a59);
    color: #2c1206; border: none; cursor: pointer; font-weight: 800;
    box-shadow: 0 8px 24px rgba(255,140,80,.35);
    transition: transform .1s, box-shadow .15s;
    white-space: nowrap;
  }
  .big-cast:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,140,80,.45); }
  .big-cast:active { transform: translateY(0); }
  .big-cast:disabled { filter: grayscale(.6); opacity:.6; cursor:not-allowed; transform:none; box-shadow: none; }

  /* ---------- 统计区 ---------- */
  .stats-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: var(--fs-md);
    align-content: center;
  }
  .stats-mini > span { color: var(--text-3); font-size: var(--fs-sm); }
  .stats-mini > b {
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(5, 10, 18, 0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: fadeIn .2s ease-out;
  }
  .modal-mask.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(20px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal {
    width: min(720px, 92vw); max-height: 86vh; overflow: auto;
    background: linear-gradient(180deg, #11233e, #0a1729);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-3);
    animation: popIn .25s cubic-bezier(.2, .9, .3, 1.2);
  }
  .modal header {
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: var(--fs-lg);

  .modal .close {
    cursor: pointer;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    color: var(--text-2);
    transition: all .15s;
  }
  .modal .close:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .modal .body { padding: 18px 20px; }

  /* ---------- 图鉴 ---------- */
  .codex {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .codex-item {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    background: rgba(255,255,255,.03);
    display: flex; gap: 12px; align-items: center;
    transition: all .15s;
  }
  .codex-item:hover {
    background: rgba(255,255,255,.07);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .codex-item.unknown { filter: grayscale(.85) brightness(.6); }
  .codex-item .emoji {
    font-size: 32px; line-height: 1;
    background: rgba(255,255,255,.05);
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .codex-item .nm { font-weight: 700; font-size: var(--fs-base); }
  .codex-item .rarity {
    font-size: var(--fs-xs); color: var(--accent);
    font-weight: 600; margin-top: 2px;
  }
  .codex-item .stat {
    font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 商店 ---------- */
  .shop-list { display: grid; gap: 10px; }
  .shop-row {
    display: grid;
    grid-template-columns: 48px 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 12px 14px;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    transition: all .15s;
  }
  .shop-row:hover { background: rgba(255,255,255,.07); border-color: var(--border-strong); }
  .shop-row .emoji {
    font-size: 24px; text-align: center;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.05);
    border-radius: var(--r-sm);
  }
  .shop-row .nm { font-weight: 700; font-size: var(--fs-base); }
  .shop-row .desc {
    font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px;
  }
  .shop-row .price {
    color: var(--accent); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .shop-row.owned {
    background: rgba(91,227,194,.08);
    border-color: rgba(91,227,194,.3);
  }
  .shop-row.owned .price { color: var(--primary); }

  /* ---------- 成就 ---------- */
  .achv-list { display: grid; gap: 8px; }
  .achv {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: rgba(255,255,255,.03);
    transition: all .15s;
  }
  .achv:hover { background: rgba(255,255,255,.07); }
  .achv.done {
    background: rgba(255, 209, 102, .08);
    border-color: rgba(255, 209, 102, .3);
  }
  .achv .ico {
    font-size: 24px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.05);
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .achv.done .ico { background: rgba(255, 209, 102, .15); }
  .achv .nm { font-weight: 700; font-size: var(--fs-base); }
  .achv .ds { font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; }
  .achv .reward {
    color: var(--primary);
    font-size: var(--fs-sm); font-weight: 700;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 日志 ---------- */
  .log-list {
    font-size: var(--fs-md); line-height: 1.8;
    max-height: 60vh; overflow: auto;
    font-variant-numeric: tabular-nums;
  }
  .log-list > div {
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .log-list > div:last-child { border-bottom: none; }
  .log-list .ts { color: var(--text-3); margin-right: 8px; font-size: var(--fs-sm); }
  .log-list .ok  { color: var(--success); }
  .log-list .err { color: var(--danger); }
  .log-list .tip { color: var(--accent); }

  /* ---------- 捕获大卡 ---------- */
  .catch-card {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 16px;
    align-items: center;
    padding: 18px;
    background: linear-gradient(135deg, rgba(91,227,194,.12), rgba(122,215,255,.06));
    border-radius: var(--r-lg);
    border: 1px solid rgba(91,227,194,.4);
  }
  .catch-card .big-fish {
    font-size: 84px; text-align: center; line-height: 1;
    background: rgba(255,255,255,.05);
    border-radius: var(--r-md);
    padding: 14px 0;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));
  }
  .catch-card h3 {
    font-size: var(--fs-2xl);
    margin-bottom: 4px;
  }
  .catch-card .rarity {
    display: inline-block;
    background: rgba(255, 209, 102, .15);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: var(--r-pill);
    font-size: var(--fs-xs); font-weight: 700;
    margin-bottom: 8px;
  }
  .catch-card .flavor {
    font-size: var(--fs-md); color: var(--text-2);
    line-height: 1.6; margin-top: 8px;
  }
  .catch-card .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px 14px; margin-top: 12px;
    font-size: var(--fs-md);
  }
  .catch-card .stats > div > span {
    display: block;
    color: var(--text-3); font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .catch-card .stats > div > b {
    color: var(--text);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .catch-card .reward {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.1);
    color: var(--accent);
    font-weight: 700;
    font-size: var(--fs-lg);
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 170px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(15, 30, 50, .92);
    border: 1px solid var(--border-strong);
    padding: 10px 18px;
    border-radius: var(--r-pill);
    font-size: var(--fs-md);
    color: var(--text);
    box-shadow: var(--shadow-2);
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 60;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Loading 屏 ---------- */
  .loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity .4s ease-out;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading-inner { text-align: center; }
  .loading-fish {
    font-size: 56px;
    animation: bobUp 1.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(91,227,194,.4));
  }
  @keyframes bobUp {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  .loading-text {
    margin-top: 14px;
    color: var(--text-2);
    font-size: var(--fs-md);
    letter-spacing: 2px;
  }
  .loading-bar {
    margin: 12px auto 0;
    width: 200px; height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: var(--r-pill);
    overflow: hidden;
    position: relative;
  }
  .loading-bar::before {
    content: ""; position: absolute; left: -40%; top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: loadingSweep 1.4s ease-in-out infinite;
  }
  @keyframes loadingSweep {
    from { left: -40%; } to { left: 100%; }
  }

  /* ---------- 新手引导 ---------- */
  .onboard-mask {
    position: fixed; inset: 0;
    z-index: 90;
    background: rgba(5, 10, 18, .55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 100px;
  }
  .onboard-mask.show { display: flex; }
  .onboard-card {
    width: min(440px, 92vw);
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.4);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    padding: 22px 22px 16px;
    position: relative;
    animation: onboardPop .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes onboardPop {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .onboard-step {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .onboard-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .onboard-desc {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .onboard-progress {
    display: flex; gap: 4px;
    margin-bottom: 14px;
  }
  .onboard-dot {
    flex: 1; height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    transition: background .25s;
  }
  .onboard-dot.active { background: var(--primary); }
  .onboard-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .onboard-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    transition: all .15s;
  }
  .onboard-btn:hover { background: rgba(255,255,255,.12); }
  .onboard-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #06161e; border: none; font-weight: 700;
  }
  .onboard-skip {
    font-size: 12px;
    color: var(--text-3);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .onboard-skip:hover { color: var(--text-2); }

  /* 高亮：被指引的元素 */
  .onboard-highlight {
    position: relative;
    z-index: 91;
    box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary) !important;
    border-radius: var(--r-md);
    animation: onboardPulse 1.5s ease-in-out infinite;
  }
  @keyframes onboardPulse {
    0%,100% { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 4px var(--primary); }
    50%     { box-shadow: 0 0 0 9999px rgba(5, 10, 18, .55), 0 0 0 10px var(--primary); }
  }

  /* ---------- <noscript> Fallback ---------- */
  .noscript-fallback {
    max-width: 480px; margin: 18vh auto;
    padding: 32px 28px;
    background: linear-gradient(180deg, #142841, #0a1729);
    border: 1px solid rgba(91,227,194,.3);
    border-radius: 16px;
    text-align: center;
    color: var(--text);
  }
  .noscript-fallback h1 {
    font-size: 24px; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--primary-2), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .noscript-fallback p {
    color: var(--text-2);
    font-size: 14px; line-height: 1.7;
    margin-bottom: 8px;
  }

  /* ---------- 中央提示条 ---------- */
  .hint {
    position: absolute; left: 50%; top: 16px;
    transform: translateX(-50%);
    background: rgba(8, 18, 32, .85);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: var(--r-pill);
    font-size: var(--fs-md);
    color: var(--text);
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow-1);
    transition: opacity .3s;
  }

  /* ---------- 收线小游戏进度条 ---------- */
  .reel-bar {
    position: relative; height: 24px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    margin: 10px 0;
  }
  .reel-bar .zone {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    opacity: .8;
    box-shadow: 0 0 12px rgba(91,227,194,.6);
  }
  .reel-bar .cursor {
    position: absolute; top: -3px; bottom: -3px;
    width: 3px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1100px) {
    .left-panel { width: 240px; }
    .controls { grid-template-columns: 1fr 1.4fr 1fr; gap: 16px; }
  }
  @media (max-width: 900px) {
    .left-panel { width: 220px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .controls > .col:last-child { display: none; }
    .side-btn { width: 72px; padding: 8px 0; }
  }
</style>
</head>

<script>
  // 等待游戏主入口已注册保存功能后再显示导航条,避免遮挡交互
  (() => {
    const KEY = 'portal_dismissed';
    if (sessionStorage.getItem(KEY)) return;
    setTimeout(() => {
      const nav = document.getElementById('portal-nav');
      if (!nav) return;
      nav.hidden = false;
      document.getElementById('portal-close')?.addEventListener('click', () => {
        nav.style.display = 'none';
        sessionStorage.setItem(KEY, '1');
      });
    }, 2000);
  })();
</script>
